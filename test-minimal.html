<!DOCTYPE html>
<html>
<head>
    <title>Test Minimale Supabase</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Test Minimale Supabase</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            console.log(message);
            output.innerHTML += '<p>' + message + '</p>';
        }
        
        async function test() {
            try {
                log('Inizio test...');
                
                // Test libreria
                if (typeof window.supabase === 'undefined') {
                    log('ERRORE: Libreria Supabase non caricata');
                    return;
                }
                
                log('Libreria OK');
                
                // Crea client
                const supabase = window.supabase.createClient(
                    'https://amhqqszzxmrphisxlsnj.supabase.co',
                    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtaHFxc3p6eG1ycGhpc3hsc25qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MDc1MjQsImV4cCI6MjA5MTQ4MzUyNH0.VubabSM4x4VrGF66a7lLVSDloUiVpdU_-Sofg5eYo4I'
                );
                
                log('Client creato');
                
                // Test connessione
                const { data, error } = await supabase
                    .from('profiles')
                    .select('count', { count: 'exact', head: true });
                
                if (error) {
                    log('ERRORE connessione: ' + error.message);
                    log('Codice errore: ' + error.code);
                } else {
                    log('SUCCESS: Connessione OK!');
                    log('Utenti trovati: ' + data);
                }
                
                // Test creazione utente
                log('Test creazione utente...');
                const timestamp = Date.now();
                const { data: userData, error: userError } = await supabase.auth.signUp({
                    email: `test${timestamp}@homedesignlab.it`,
                    password: 'test12345',
                    options: {
                        data: {
                            full_name: 'Test User',
                            role: 'client'
                        }
                    }
                });
                
                if (userError) {
                    log('ERRORE creazione utente: ' + userError.message);
                } else {
                    log('SUCCESS: Utente creato!');
                    log('User ID: ' + userData.user?.id);
                }
                
            } catch (error) {
                log('ERRORE GENERICO: ' + error.message);
            }
        }
        
        // Esegui test
        test();
    </script>
</body>
</html>
