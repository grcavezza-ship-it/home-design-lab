<script>
    // Funzione per caricare gli immobili
    window.loadImmobili = async function() {
        try {
            console.log('Caricamento immobili...');
            
            const res = await fetch('/api/gestione-immobili');
            if (!res.ok) throw new Error('Errore caricamento');
            const data = await res.json();
            
            console.log('Immobili caricati:', data);
            renderImmobili(data || []);
            updateStats(data || []);
            
        } catch (error) {
            console.error('Errore loadImmobili:', error);
            const grid = document.getElementById('immobili-grid');
            if (grid) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <div class="inline-flex items-center justify-center w-16 h-16 bg-red-100 rounded-full mb-4">
                            <span class="material-symbols-outlined text-red-600 text-2xl">error</span>
                        </div>
                        <p class="text-red-600">Errore nel caricamento degli immobili</p>
                    </div>
                `;
            }
        }
    };

    // Funzione per renderizzare gli immobili
    window.renderImmobili = function(immobili) {
        const grid = document.getElementById('immobili-grid');
        if (!grid) return;
        
        if (!immobili || immobili.length === 0) {
            grid.innerHTML = `
                <div class="col-span-full text-center py-12">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-stone-100 rounded-full mb-4">
                        <span class="material-symbols-outlined text-stone-400 text-2xl">home</span>
                    </div>
                    <p class="text-stone-600">Nessun immobile presente</p>
                    <button onclick="window.location.href='creazione-immobile.html'" class="mt-4 bg-primary text-white px-6 py-3 rounded-lg font-medium hover:bg-primary/90 transition-colors flex items-center gap-2 mx-auto">
                        <span class="material-symbols-outlined">add</span>
                        Aggiungi il primo immobile
                    </button>
                </div>
            `;
            return;
        }
        
        grid.innerHTML = immobili.map(immobile => {
            const statoClass = immobile.stato_immobile === 'Disponibile' ? 'bg-green-100 text-green-800' : 
                               immobile.stato_immobile === 'Venduto' ? 'bg-red-100 text-red-800' : 
                               'bg-yellow-100 text-yellow-800';
            
            let primaImmagine = null;
            if (immobile.immagini_urls) {
                let urls = immobile.immagini_urls;
                if (typeof urls === 'string') try { urls = JSON.parse(urls); } catch(e) {}
                if (Array.isArray(urls) && urls.length > 0) primaImmagine = urls[0];
            }
            
            const immagineHtml = primaImmagine
                ? `<img src="${primaImmagine}" alt="${immobile.titolo || ''}" class="w-full h-full object-cover">`
                : `<span class="material-symbols-outlined text-stone-400 text-4xl">home</span>`;
            
            const prezzo = immobile.prezzo_richiesta
                ? Number(immobile.prezzo_richiesta).toLocaleString('it-IT', { minimumFractionDigits: 0, maximumFractionDigits: 0 })
                : null;
            
            return `
                <div class="bg-white rounded-xl shadow-sm border border-stone-100 overflow-hidden hover:shadow-lg transition-shadow">
                    <div onclick="window.location.href='creazione-immobile.html?id=${immobile.id}'" class="h-48 bg-gradient-to-br from-stone-200 to-stone-300 flex items-center justify-center overflow-hidden cursor-pointer">
                        ${immagineHtml}
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-lg font-semibold text-stone-800">${immobile.titolo || 'Immobile senza titolo'}</h3>
                            <span class="text-xs font-medium px-2 py-1 rounded-full ${statoClass}">
                                ${immobile.stato_immobile || 'N/D'}
                            </span>
                        </div>
                        <div class="space-y-2 text-sm text-stone-600">
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-base">location_on</span>
                                <span>${immobile.citta || 'N/D'}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-base">euro</span>
                                <span class="font-semibold text-stone-800">€${prezzo || 'N/D'}</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-base">straighten</span>
                                <span>${immobile.superficie || 'N/D'} mq</span>
                            </div>
                        </div>
                        <div class="mt-4 pt-4 border-t border-stone-100 flex justify-between items-center">
                            <span class="text-xs text-stone-500">${immobile.tipologia || 'N/D'}</span>
                            <button onclick="window.location.href='creazione-immobile.html?id=${immobile.id}'" class="text-primary hover:text-primary/80 text-sm font-medium">
                                Modifica →
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    };

    // Funzione per aggiornare le statistiche
    window.updateStats = function(immobili) {
        const totalElement = document.getElementById('total-immobili');
        const disponibiliElement = document.getElementById('disponibili-immobili');
        const vendutiElement = document.getElementById('venduti-immobili');
        const valoreMedioElement = document.getElementById('valore-medio');
        
        if (totalElement) totalElement.textContent = immobili.length;
        
        const disponibili = immobili.filter(i => i.stato_immobile === 'Disponibile').length;
        if (disponibiliElement) disponibiliElement.textContent = disponibili;
        
        const venduti = immobili.filter(i => i.stato_immobile === 'Venduto').length;
        if (vendutiElement) vendutiElement.textContent = venduti;
        
        const prezziValidi = immobili.filter(i => i.prezzo_richiesta);
        const valoreMedio = prezziValidi.length > 0 
            ? prezziValidi.reduce((sum, i) => sum + i.prezzo_richiesta, 0) / prezziValidi.length
            : 0;
        if (valoreMedioElement) valoreMedioElement.textContent = `€${Math.round(valoreMedio).toLocaleString('it-IT')}`;
    };

    // Inizializzazione quando Supabase è pronto
    const checkSupabase = setInterval(() => {
        if (window.supabase && typeof window.supabase.from === 'function') {
            clearInterval(checkSupabase);
            loadImmobili();
        }
    }, 100);
</script>

<!-- Avatar Dropdown Script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const avatarBtn = document.getElementById('avatar-btn');
    const avatarDropdown = document.getElementById('avatar-dropdown');
    const dropdownLogout = document.getElementById('dropdown-logout');
    
    if (avatarBtn) {
        avatarBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            avatarDropdown.classList.toggle('hidden');
        });
    }
    
    document.addEventListener('click', function() {
        if (avatarDropdown) avatarDropdown.classList.add('hidden');
    });
    
    if (dropdownLogout) {
        dropdownLogout.addEventListener('click', function(e) {
            e.preventDefault();
            localStorage.clear();
            alert('Logout effettuato con successo.');
            window.location.href = '/login';
        });
    }
});
});
    // Mobile sidebar toggle
    var menuToggle = document.getElementById('mobile-menu-toggle');
    var sidebar = document.getElementById('sidebar-menu');
    var overlay = document.getElementById('mobile-sidebar-overlay');
    function openSidebar() {
        sidebar.classList.remove('-translate-x-full');
        sidebar.classList.add('translate-x-0');
        overlay.classList.remove('hidden');
        if (menuToggle) menuToggle.querySelector('.material-symbols-outlined').textContent = 'close';
    }
    function closeSidebar() {
        sidebar.classList.add('-translate-x-full');
        sidebar.classList.remove('translate-x-0');
        overlay.classList.add('hidden');
        if (menuToggle) menuToggle.querySelector('.material-symbols-outlined').textContent = 'menu';
    }
    if (menuToggle) {
        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            var isOpen = !sidebar.classList.contains('-translate-x-full');
            if (isOpen) closeSidebar();
            else openSidebar();
        });
    }
    if (overlay) overlay.addEventListener('click', closeSidebar);
    function checkScreenSize() {
        if (window.innerWidth >= 1024) {
            sidebar.classList.remove('-translate-x-full');
            sidebar.classList.remove('translate-x-0');
            overlay.classList.add('hidden');
            if (menuToggle) menuToggle.querySelector('.material-symbols-outlined').textContent = 'menu';
        } else {
            closeSidebar();
        }
    }
    window.addEventListener('resize', checkScreenSize);
</script>
