<!DOCTYPE html>
<html class="light" lang="it">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Test Connessione Supabase - Home Design Lab</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Manrope', sans-serif; }
        .font-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased">
    <div class="max-w-4xl mx-auto p-8">
        <h1 class="text-3xl font-headline text-primary mb-8">Test Connessione Supabase</h1>
        
        <!-- Configuration Check -->
        <div class="bg-surface-container rounded-xl p-6 mb-8 border border-outline-variant/20">
            <h2 class="text-xl font-semibold mb-4">Configurazione Supabase</h2>
            <div id="config-check">
                <p class="text-on-surface-variant">Verifica configurazione...</p>
            </div>
            <div class="mt-4">
                <button onclick="testConnection()" class="px-4 py-2 bg-primary text-on-primary rounded-lg hover:bg-secondary transition-colors">
                    Testa Connessione
                </button>
            </div>
        </div>

        <!-- Manual Configuration -->
        <div class="bg-surface-container rounded-xl p-6 mb-8 border border-outline-variant/20">
            <h2 class="text-xl font-semibold mb-4">Configurazione Manuale</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-on-surface mb-1">Supabase URL</label>
                    <input type="text" id="supabase-url" placeholder="https://your-project-id.supabase.co" 
                           class="w-full px-3 py-2 border border-outline-variant/30 rounded-lg focus:outline-none focus:border-primary">
                </div>
                <div>
                    <label class="block text-sm font-medium text-on-surface mb-1">Supabase Anon Key</label>
                    <input type="text" id="supabase-key" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..." 
                           class="w-full px-3 py-2 border border-outline-variant/30 rounded-lg focus:outline-none focus:border-primary">
                </div>
                <button onclick="testManualConnection()" class="px-4 py-2 bg-secondary text-on-primary rounded-lg hover:bg-primary transition-colors">
                    Testa Configurazione Manuale
                </button>
            </div>
        </div>

        <!-- Debug Console -->
        <div class="bg-surface-container rounded-xl p-6 border border-outline-variant/20">
            <h2 class="text-xl font-semibold mb-4">Debug Console</h2>
            <div id="debug-console" class="bg-surface rounded-lg p-4 font-mono text-sm max-h-64 overflow-y-auto">
                <p class="text-on-surface-variant">In attesa di eventi...</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        let supabase = null;

        function log(message) {
            const debugConsole = document.getElementById('debug-console');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'mb-1';
            logEntry.innerHTML = `<span class="text-on-surface-variant">[${timestamp}]</span> ${message}`;
            
            debugConsole.appendChild(logEntry);
            debugConsole.scrollTop = debugConsole.scrollHeight;
            
            window.console.log('[SupabaseTest]', message);
        }

        function updateConfigCheck(status, message, type = 'info') {
            const configCheck = document.getElementById('config-check');
            const colors = {
                success: 'text-success',
                error: 'text-error',
                warning: 'text-warning',
                info: 'text-primary'
            };
            
            configCheck.innerHTML = `
                <p class="${colors[type]} font-medium">${status}</p>
                <p class="text-sm text-on-surface-variant mt-1">${message}</p>
                <p class="text-xs text-on-surface-variant mt-1">
                    Timestamp: ${new Date().toLocaleString()}
                </p>
            `;
        }

        async function testConnection() {
            log('=== Testing Supabase Connection ===');
            
            try {
                // Check if Supabase library is loaded
                if (typeof window.supabase === 'undefined') {
                    log('ERROR: Supabase library not loaded');
                    updateConfigCheck('ERROR', 'Libreria Supabase non caricata', 'error');
                    return;
                }
                
                log('Supabase library loaded successfully');
                
                // Try to create client with default values
                log('Attempting to create Supabase client...');
                
                // Check if we have environment variables or default values
                const defaultUrl = 'https://your-project-id.supabase.co';
                const defaultKey = 'your-anon-key-here';
                
                log('Default URL: ' + defaultUrl);
                log('Default Key: ' + defaultKey.substring(0, 20) + '...');
                
                supabase = window.supabase.createClient(defaultUrl, defaultKey);
                
                log('Supabase client created');
                
                // Test basic connection
                log('Testing basic connection...');
                
                // Try a simple query that should work even with wrong credentials
                const { data, error } = await supabase
                    .from('profiles')
                    .select('count', { count: 'exact', head: true });

                log('Query response received');
                log('Error: ' + (error ? JSON.stringify(error) : 'NONE'));
                log('Data: ' + (data ? JSON.stringify(data) : 'NONE'));

                if (error) {
                    if (error.code === 'PGRST301') {
                        updateConfigCheck('ERROR', 'URL Supabase non valido - sostituisci con il tuo URL progetto', 'error');
                    } else if (error.code === 'PGRST302') {
                        updateConfigCheck('ERROR', 'API Key non valida - sostituisci con la tua anon key', 'error');
                    } else if (error.code === 'PGRST116') {
                        updateConfigCheck('SUCCESS', 'Connessione OK ma tabella profiles non esiste', 'success');
                    } else {
                        updateConfigCheck('ERROR', 'Errore connessione: ' + error.message, 'error');
                    }
                } else {
                    updateConfigCheck('SUCCESS', 'Connessione Supabase funzionante!', 'success');
                }

            } catch (error) {
                log('=== CONNECTION ERROR ===');
                log('Error type: ' + typeof error);
                log('Error name: ' + error.name);
                log('Error message: ' + error.message);
                log('Error stack: ' + error.stack);
                
                updateConfigCheck('ERROR', 'Errore: ' + error.message, 'error');
            }
            
            log('=== Connection test completed ===');
        }

        async function testManualConnection() {
            const url = document.getElementById('supabase-url').value.trim();
            const key = document.getElementById('supabase-key').value.trim();
            
            if (!url || !key) {
                log('ERROR: URL e Key richiesti per configurazione manuale');
                updateConfigCheck('ERROR', 'Inserisci URL e API Key', 'error');
                return;
            }
            
            log('=== Testing Manual Configuration ===');
            log('URL: ' + url);
            log('Key: ' + key.substring(0, 20) + '...');
            
            try {
                supabase = window.supabase.createClient(url, key);
                log('Manual Supabase client created');
                
                // Test connection
                const { data, error } = await supabase
                    .from('profiles')
                    .select('count', { count: 'exact', head: true });

                log('Manual query response received');
                log('Error: ' + (error ? JSON.stringify(error) : 'NONE'));
                log('Data: ' + (data ? JSON.stringify(data) : 'NONE'));

                if (error) {
                    updateConfigCheck('ERROR', 'Errore configurazione manuale: ' + error.message, 'error');
                } else {
                    updateConfigCheck('SUCCESS', 'Configurazione manuale funzionante!', 'success');
                }

            } catch (error) {
                log('Manual configuration error: ' + error.message);
                updateConfigCheck('ERROR', 'Errore configurazione: ' + error.message, 'error');
            }
            
            log('=== Manual configuration test completed ===');
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            log('Page loaded');
            log('Supabase library available: ' + (typeof window.supabase !== 'undefined' ? 'YES' : 'NO'));
            
            if (typeof window.supabase !== 'undefined') {
                updateConfigCheck('INFO', 'Libreria Supabase caricata, pronta per test', 'info');
            } else {
                updateConfigCheck('ERROR', 'Libreria Supabase non caricata', 'error');
            }
        });
    </script>
</body>
</html>
