<script src="assets/js/portal-init.js"></script>

<script>
var allTasks = [];
var allOperators = [];
var allProjects = [];

function formatDate(d) {
    if (!d) return '';
    var dt = new Date(d);
    if (isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
}

function priorityColor(p) {
    if (p === 'urgent') return 'text-error';
    if (p === 'high') return 'text-orange-500';
    if (p === 'low') return 'text-stone-400';
    return 'text-tertiary';
}

function operatoreName(id) {
    var op = allOperators.find(function(o) { return o.id === id; });
    return op ? (op.nome + ' ' + (op.cognome || '')) : id.substring(0,8);
}

function projectName(id) {
    var p = allProjects.find(function(pj) { return pj.id === id; });
    return p ? p.titolo : null;
}

function renderTasks() {
    var pendingEl = document.getElementById('tasks-pending');
    var completedEl = document.getElementById('tasks-completed');
    pendingEl.innerHTML = '';
    completedEl.innerHTML = '';

    var filterOp = document.getElementById('filter-operator').value;
    var filterPrj = document.getElementById('filter-project').value;
    var filterPri = document.getElementById('filter-priority').value;

    var filtered = allTasks.filter(function(t) {
        if (filterOp && t.assigned_to !== filterOp) return false;
        if (filterPrj && t.project_id !== filterPrj) return false;
        if (filterPri && t.priority !== filterPri) return false;
        return true;
    });

    var pending = filtered.filter(function(t) { return t.status === 'todo' || t.status === 'in_progress'; });
    var completed = filtered.filter(function(t) { return t.status === 'completed' || t.status === 'cancelled'; });

    if (pending.length === 0) {
        pendingEl.innerHTML = '<div class="text-center py-8 text-on-surface-variant font-label text-sm">Nessun compito in sospeso</div>';
    } else {
        pending.forEach(function(t) {
            var prjName = projectName(t.project_id);
            pendingEl.appendChild(createTaskCard(t, prjName));
        });
    }

    if (completed.length === 0) {
        completedEl.innerHTML = '<div class="text-center py-8 text-on-surface-variant font-label text-sm">Nessun compito completato</div>';
    } else {
        completed.forEach(function(t) {
            var prjName = projectName(t.project_id);
            completedEl.appendChild(createTaskCard(t, prjName, true));
        });
    }
}

function createTaskCard(task, prjName, isCompleted) {
    var div = document.createElement('div');
    div.className = 'bg-surface-container-low rounded-lg p-4 border-l-4 ' + (task.priority === 'urgent' ? 'border-l-error' : task.priority === 'high' ? 'border-l-orange-400' : 'border-l-tertiary');
    var dueHtml = task.due_date ? '<span class="font-label text-xs text-on-surface-variant">Scadenza: ' + formatDate(task.due_date) + '</span>' : '';
    var prjHtml = prjName ? '<span class="font-label text-xs text-primary">' + prjName + '</span>' : '';
    var opName = operatoreName(task.assigned_to);

    div.innerHTML =
        '<div class="flex justify-between items-start mb-2">' +
            '<div class="flex-1">' +
                '<h4 class="font-headline text-sm text-on-surface">' + task.title + '</h4>' +
                (task.description ? '<p class="font-label text-xs text-on-surface-variant mt-1">' + task.description + '</p>' : '') +
            '</div>' +
            '<span class="font-label text-xs ' + priorityColor(task.priority) + ' uppercase tracking-wider">' + task.priority + '</span>' +
        '</div>' +
        '<div class="flex items-center justify-between mt-3">' +
            '<div class="flex items-center gap-3">' +
                '<span class="font-label text-xs text-on-surface-variant">' + opName + '</span>' +
                (prjHtml ? '<span class="text-outline">·</span>' + prjHtml : '') +
            '</div>' +
            '<div class="flex items-center gap-2">' +
                dueHtml +
                (isCompleted ? '' :
                    '<button class="task-complete-btn text-primary hover:text-primary-container transition-colors" data-id="' + task.id + '" title="Segna completato">' +
                        '<span class="material-symbols-outlined text-[18px]">check_circle</span>' +
                    '</button>'
                ) +
            '</div>' +
        '</div>';

    var btnComplete = div.querySelector('.task-complete-btn');
    if (btnComplete) {
        btnComplete.addEventListener('click', function() {
            completeTask(task.id);
        });
    }

    return div;
}

async function completeTask(id) {
    var { error } = await window.supabase
        .from('tasks')
        .update({ status: 'completed', completed_at: new Date().toISOString() })
        .eq('id', id);
    if (error) { console.error('Errore completamento:', error.message); return; }
    await loadTasks();
    window.logActivity('completed', 'task', id, 'Compito completato: ' + (allTasks.find(function(t) { return t.id === id; }) || {}).title);
}

async function loadTasks() {
    var { data } = await window.supabase.from('tasks').select('*').order('created_at', { ascending: false });
    if (data) allTasks = data;
    renderTasks();
}

async function loadOperators() {
    var { data } = await window.supabase.from('operatori_profiles').select('id, nome, cognome').eq('is_active', true);
    if (!data) return;
    allOperators = data;
    var selOp = document.getElementById('filter-operator');
    var selTask = document.getElementById('task-operator');
    selOp.innerHTML = '<option value="">Tutti</option>';
    selTask.innerHTML = '';
    data.forEach(function(op) {
        var name = op.nome + ' ' + (op.cognome || '');
        selOp.innerHTML += '<option value="' + op.id + '">' + name + '</option>';
        selTask.innerHTML += '<option value="' + op.id + '">' + name + '</option>';
    });
}

async function loadProjects() {
    var { data } = await window.supabase.from('projects').select('id, titolo').order('created_at', { ascending: false });
    if (!data) return;
    allProjects = data;
    var selPrj = document.getElementById('filter-project');
    var selTask = document.getElementById('task-project');
    selPrj.innerHTML = '<option value="">Tutti</option>';
    selTask.innerHTML = '<option value="">Nessuno</option>';
    data.forEach(function(p) {
        selPrj.innerHTML += '<option value="' + p.id + '">' + p.titolo + '</option>';
        selTask.innerHTML += '<option value="' + p.id + '">' + p.titolo + '</option>';
    });
}



document.getElementById('btn-new-task').addEventListener('click', function() {
    document.getElementById('task-id').value = '';
    document.getElementById('task-form').reset();
    document.getElementById('modal-task').classList.remove('hidden');
    document.getElementById('modal-task').classList.add('flex');
});

document.getElementById('modal-close').addEventListener('click', function() {
    document.getElementById('modal-task').classList.add('hidden');
    document.getElementById('modal-task').classList.remove('flex');
});

document.getElementById('modal-task').addEventListener('click', function(e) {
    if (e.target === this) {
        this.classList.add('hidden');
        this.classList.remove('flex');
    }
});

document.getElementById('task-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    var title = document.getElementById('task-title').value.trim();
    var desc = document.getElementById('task-desc').value.trim();
    var assigned_to = document.getElementById('task-operator').value;
    var project_id = document.getElementById('task-project').value || null;
    var priority = document.getElementById('task-priority').value;
    var due_date = document.getElementById('task-due').value || null;

    if (!title || !assigned_to) return;

    var { data: { user } } = await window.supabase.auth.getUser();
    if (!user) { alert('Non autenticato'); return; }

    var { error } = await window.supabase.from('tasks').insert({
        title: title,
        description: desc,
        assigned_to: assigned_to,
        created_by: user.id,
        project_id: project_id,
        priority: priority,
        due_date: due_date,
        status: 'todo'
    });

    if (error) { console.error('Errore creazione task:', error.message); alert('Errore: ' + error.message); return; }

    document.getElementById('modal-task').classList.add('hidden');
    document.getElementById('modal-task').classList.remove('flex');
    await loadTasks();
    window.logActivity('create', 'task', '', 'Nuovo compito: ' + title);
});

document.getElementById('filter-operator').addEventListener('change', renderTasks);
document.getElementById('filter-project').addEventListener('change', renderTasks);
document.getElementById('filter-priority').addEventListener('change', renderTasks);

document.addEventListener('DOMContentLoaded', function() {
    Promise.all([loadTasks(), loadOperators(), loadProjects()]);

    var avatarBtn = document.getElementById('avatar-btn');
    var avatarDropdown = document.getElementById('avatar-dropdown');
    var dropdownLogout = document.getElementById('dropdown-logout');

    if (avatarBtn) {
        avatarBtn.addEventListener('click', function(e) { e.stopPropagation(); avatarDropdown.classList.toggle('hidden'); });
    }
    document.addEventListener('click', function() { if (avatarDropdown) avatarDropdown.classList.add('hidden'); });
    if (dropdownLogout) {
        dropdownLogout.addEventListener('click', async function(e) {
            e.preventDefault();
            if (window.supabase) await window.supabase.auth.signOut();
            localStorage.clear();
            window.location.href = 'templates/login.html';
        });
    }
});
</script>
