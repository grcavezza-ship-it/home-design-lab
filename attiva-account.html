<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attiva account | Home Design Lab</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script>tailwind.config={theme:{extend:{colors:{primary:'#005220','primary-container':'#186c32',surface:'#fbf9f8'},fontFamily:{display:['Noto Serif'],body:['Manrope']}}}};</script>
</head>
<body class="min-h-screen bg-[#f6f3f2] flex items-center justify-center p-6 font-body text-[#1b1c1c]">
<div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-stone-200 overflow-hidden">
  <div class="p-8 text-center border-b border-stone-100">
    <p class="font-display text-2xl font-bold text-[#186C32] tracking-tight">Home Design Lab</p>
    <p id="subtitle" class="text-sm text-stone-500 mt-2">Attiva il tuo account</p>
  </div>
  <div class="p-8">
    <div id="loading" class="text-center py-8"><div class="mx-auto w-8 h-8 border-2 border-[#186C32] border-t-transparent rounded-full animate-spin"></div><p class="text-sm text-stone-500 mt-3">Verifica del collegamento in corso...</p></div>
    <div id="form-wrap" class="hidden">
      <p id="welcome" class="text-sm text-stone-600 mb-6"></p>
      <form id="activate-form" class="space-y-4">
        <label class="block text-sm font-medium">Nuova password<input id="password" type="password" autocomplete="new-password" required class="mt-1 w-full rounded-lg border-stone-200 px-3 py-2.5"></label>
        <label class="block text-sm font-medium">Conferma password<input id="password2" type="password" autocomplete="new-password" required class="mt-1 w-full rounded-lg border-stone-200 px-3 py-2.5"></label>
        <div class="text-xs text-stone-500 space-y-1">
          <p id="rule-length">• Almeno 8 caratteri</p>
          <p id="rule-upper">• Una lettera maiuscola</p>
          <p id="rule-number">• Un numero</p>
        </div>
        <button id="submit" type="submit" class="w-full bg-gradient-to-br from-[#005220] to-[#186c32] text-white rounded-lg py-3 font-semibold">Attiva account</button>
      </form>
    </div>
    <div id="message" class="hidden rounded-lg px-4 py-3 text-sm"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/portal-config.js"></script>
<script>
(async()=>{
  const $=id=>document.getElementById(id);
  function msg(text,ok=false){const el=$('message');el.textContent=text;el.className='rounded-lg px-4 py-3 text-sm '+(ok?'bg-green-50 border border-green-200 text-green-800':'bg-red-50 border border-red-200 text-red-800');el.classList.remove('hidden')}
  try{
    await loadPortalConfig();
    const sb=window.supabase.createClient(PORTAL_CONFIG.supabase.url,PORTAL_CONFIG.supabase.anonKey);
    const {data:{session}}=await sb.auth.getSession();
    if(!session?.user){$('loading').classList.add('hidden');msg('Il link di attivazione non è valido o è scaduto. Richiedi un nuovo invito.');return}
    $('loading').classList.add('hidden');$('form-wrap').classList.remove('hidden');
    const u=session.user; const name=u.user_metadata?.nome||''; $('welcome').textContent=`Ciao ${name}, scegli la password personale che userai per accedere al portale.`;
    const pwd=$('password'),pwd2=$('password2');
    function check(){const v=pwd.value;$('rule-length').className='text-xs '+(v.length>=8?'text-green-700':'text-stone-500');$('rule-upper').className='text-xs '+(/[A-Z]/.test(v)?'text-green-700':'text-stone-500');$('rule-number').className='text-xs '+(/\d/.test(v)?'text-green-700':'text-stone-500')}
    pwd.addEventListener('input',check);
    $('activate-form').addEventListener('submit',async e=>{e.preventDefault();const p=pwd.value;if(p!==pwd2.value)return msg('Le password non coincidono.');if(p.length<8||!/[A-Z]/.test(p)||!/\d/.test(p))return msg('La password non soddisfa tutti i requisiti.');$('submit').disabled=true;$('submit').textContent='Attivazione in corso...';const {error}=await sb.auth.updateUser({password:p});if(error){$('submit').disabled=false;$('submit').textContent='Attiva account';return msg(error.message||'Impossibile impostare la password.')}const role=u.user_metadata?.portal_role;msg('Account attivato correttamente. Ti reindirizziamo...',true);setTimeout(()=>{const target=role==='admin'?'dashboard-senior.html':role==='client'?'area-cliente.html':'dashboard-operatore.html';window.location.href=target},900)})
  }catch(e){$('loading').classList.add('hidden');msg('Errore durante l’attivazione: '+(e.message||e))}
})();
</script>
</body>
</html>
