<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Login - Home Design Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold mb-6">Test Login Supabase</h1>
        
        <div id="status" class="mb-4 p-4 bg-gray-100 rounded"></div>
        
        <form id="testForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" value="info@homedesignlab.it" 
                       class="w-full p-2 border rounded" required>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" value="Password123!" 
                       class="w-full p-2 border rounded" required>
            </div>
            <button type="submit" 
                    class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">
                Test Login
            </button>
        </form>
        
        <div class="mt-6 space-y-2">
            <button onclick="testSupabaseConnection()" 
                    class="w-full bg-green-500 text-white p-2 rounded hover:bg-green-600">
                Test Connessione Supabase
            </button>
            <button onclick="createTestUser()" 
                    class="w-full bg-purple-500 text-white p-2 rounded hover:bg-purple-600">
                Crea Utente Test
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configurazione Supabase
        const SUPABASE_URL = 'https://fjwcgawzjfhqzjgztfgg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqd2NnYXd6amZocXpqZ3p0ZmdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjk1NzQ0MzgsImV4cCI6MjA0NTE1MDQzOH0.qvJn-sxLr3J2i0X3xO1JdYk3m-7kXKzR0eF1bH2q0M';
        
        let supabase = null;
        const statusDiv = document.getElementById('status');
        
        function updateStatus(message, type = 'info') {
            const colors = {
                info: 'bg-blue-100 text-blue-800',
                success: 'bg-green-100 text-green-800',
                error: 'bg-red-100 text-red-800',
                warning: 'bg-yellow-100 text-yellow-800'
            };
            
            statusDiv.className = `mb-4 p-4 rounded ${colors[type]}`;
            statusDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
        }
        
        // Inizializza Supabase
        function initSupabase() {
            try {
                if (window.supabase && window.supabase.createClient) {
                    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                    updateStatus('Supabase client inizializzato con successo', 'success');
                    return true;
                } else {
                    updateStatus('Libreria Supabase non caricata', 'error');
                    return false;
                }
            } catch (error) {
                updateStatus(`Errore inizializzazione: ${error.message}`, 'error');
                return false;
            }
        }
        
        // Test connessione
        async function testSupabaseConnection() {
            updateStatus('Test connessione in corso...', 'info');
            
            if (!supabase) {
                if (!initSupabase()) return;
            }
            
            try {
                // Test semplice: ottieni sessione corrente
                const { data, error } = await supabase.auth.getSession();
                
                if (error) {
                    updateStatus(`Errore connessione: ${error.message}`, 'error');
                } else {
                    updateStatus('Connessione Supabase funzionante', 'success');
                }
            } catch (error) {
                updateStatus(`Errore test: ${error.message}`, 'error');
            }
        }
        
        // Crea utente test
        async function createTestUser() {
            updateStatus('Creazione utente test in corso...', 'info');
            
            if (!supabase) {
                if (!initSupabase()) return;
            }
            
            try {
                const { data, error } = await supabase.auth.signUp({
                    email: 'test@example.com',
                    password: 'TestPassword123!',
                    options: {
                        data: {
                            first_name: 'Test',
                            last_name: 'User'
                        }
                    }
                });
                
                if (error) {
                    updateStatus(`Errore creazione utente: ${error.message}`, 'error');
                } else {
                    updateStatus('Utente test creato con successo', 'success');
                }
            } catch (error) {
                updateStatus(`Errore creazione: ${error.message}`, 'error');
            }
        }
        
        // Form submit
        document.getElementById('testForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            updateStatus(`Tentativo login con ${email}...`, 'info');
            
            if (!supabase) {
                if (!initSupabase()) return;
            }
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    updateStatus(`Errore login: ${error.message}`, 'error');
                } else {
                    updateStatus(`Login successful! User: ${data.user?.email}`, 'success');
                    
                    // Reindirizza al portale admin dopo 2 secondi
                    setTimeout(() => {
                        window.location.href = 'admin-clean.html';
                    }, 2000);
                }
            } catch (error) {
                updateStatus(`Errore login: ${error.message}`, 'error');
            }
        });
        
        // Inizializza al caricamento
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('Pagina caricata. Inizializzazione Supabase...', 'info');
            setTimeout(initSupabase, 1000);
        });
    </script>
<script src="assets/js/cookie-banner.js"></script>
</body>
</html>
