<script>
function getIdFromUrl() {
    var params = new URLSearchParams(window.location.search);
    return params.get('id');
}

function formatPrice(val) {
    return new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(val);
}

document.addEventListener('DOMContentLoaded', function() {
    var id = getIdFromUrl();
    var root = document.getElementById('property-root');
    if (!id) {
        root.innerHTML = '<div class="max-w-7xl mx-auto px-8 py-32 text-center"><p class="text-lg text-on-surface-variant">Nessun immobile specificato. <a href="collection.html" class="text-primary underline">Torna alla collezione</a></p></div>';
        return;
    }
    fetch('/api/immobili/' + id)
        .then(function(r) { return r.json(); })
        .then(function(p) {
            if (!p || p.error) throw new Error('Not found');
            var imgs = p.immagini_urls || [];
            var cover = imgs.length > 0 ? imgs[0] : '';
            var price = p.prezzo_richiesta ? formatPrice(p.prezzo_richiesta) : '';
            var location = [p.indirizzo, p.citta].filter(Boolean).join(', ');
            var superficie = p.superficie ? p.superficie + ' m²' : '';
            var badge = p.stato_immobile === 'disponibile' ? '<span class="inline-block bg-surface/90 backdrop-blur px-5 py-2 text-[10px] font-bold uppercase tracking-[0.2em] text-primary">Disponibile</span>' : '<span class="inline-block bg-surface/90 backdrop-blur px-5 py-2 text-[10px] font-bold uppercase tracking-[0.2em]">' + (p.stato_immobile || '') + '</span>';

            var specsHtml = '';
            if (superficie || p.numero_vani || p.piano) {
                specsHtml = '<div class="grid grid-cols-2 md:grid-cols-4 gap-8 py-12 border-y border-outline-variant/30">';
                if (superficie) specsHtml += '<div><span class="material-symbols-outlined text-3xl text-primary mb-2 block">straighten</span><span class="text-[11px] uppercase tracking-widest text-on-surface-variant font-bold">' + superficie + '</span></div>';
                if (p.numero_vani) specsHtml += '<div><span class="material-symbols-outlined text-3xl text-primary mb-2 block">meeting_room</span><span class="text-[11px] uppercase tracking-widest text-on-surface-variant font-bold">' + p.numero_vani + (p.tipologia && p.tipologia.toLowerCase().includes('residenziale') ? ' Locali' : ' Vani') + '</span></div>';
                if (p.piano) specsHtml += '<div><span class="material-symbols-outlined text-3xl text-primary mb-2 block">floor</span><span class="text-[11px] uppercase tracking-widest text-on-surface-variant font-bold">Piano ' + p.piano + '</span></div>';
                if (p.tipologia) specsHtml += '<div><span class="material-symbols-outlined text-3xl text-primary mb-2 block">category</span><span class="text-[11px] uppercase tracking-widest text-on-surface-variant font-bold">' + p.tipologia + '</span></div>';
                specsHtml += '</div>';
            }

            var descHtml = p.descrizione ? '<div class="max-w-3xl"><p class="text-lg text-on-surface-variant leading-relaxed font-light">' + p.descrizione + '</p></div>' : '';

            var galleryHtml = '';
            if (imgs.length > 1) {
                galleryHtml = '<section class="py-16 md:py-24 bg-surface-container-low"><div class="max-w-7xl mx-auto px-4 md:px-8"><div class="mb-8 md:mb-12"><span class="text-[10px] uppercase tracking-[0.3em] text-primary font-bold">Galleria</span><h3 class="text-2xl md:text-4xl font-serif italic mt-2">Altre <span class="text-primary">Immagini</span></h3></div><div class="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">' +
                    imgs.slice(1).map(function(i) { return '<div class="aspect-[4/3] overflow-hidden rounded-xl bg-surface-container-high"><img src="' + i + '" class="w-full h-full object-cover hover:scale-110 transition-transform duration-700"/></div>'; }).join('') +
                    '</div></div></section>';
            }

            var dotazioniHtml = '';
            if (p.dotazioni && p.dotazioni.length > 0) {
                var items = typeof p.dotazioni === 'string' ? p.dotazioni.split(',').map(function(s) { return s.trim(); }) : p.dotazioni;
                dotazioniHtml = '<div class="max-w-3xl mt-12"><span class="text-[10px] uppercase tracking-widest font-bold text-primary">Dotazioni</span><div class="flex flex-wrap gap-3 mt-4">' +
                    items.map(function(d) { return '<span class="bg-surface-container-high px-4 py-2 rounded-lg text-sm font-medium">' + d + '</span>'; }).join('') +
                    '</div></div>';
            }

            root.innerHTML =
                (cover ? '<div class="relative h-[50vh] md:h-[75vh] overflow-hidden"><img src="' + cover + '" class="w-full h-full object-cover"/><div class="absolute inset-0 bg-gradient-to-t from-[#1b1c1c]/80 via-[#1b1c1c]/20 to-transparent"></div><div class="absolute bottom-0 left-0 right-0 max-w-7xl mx-auto px-4 md:px-8 pb-8 md:pb-16"><div class="flex flex-col md:flex-row md:items-end justify-between gap-4 md:gap-6"><div><a href="collection.html" class="inline-flex items-center gap-2 text-xs uppercase tracking-widest font-bold text-white/70 hover:text-white transition-colors mb-4 md:mb-6"><span class="material-symbols-outlined text-base">arrow_back</span>Torna alla Collezione</a><h1 class="text-3xl md:text-5xl lg:text-7xl font-serif italic text-white leading-tight">' + (p.titolo || 'Proprietà') + '</h1>' + (location ? '<p class="text-xs md:text-sm text-white/70 mt-2 flex items-center gap-2"><span class="material-symbols-outlined text-base">location_on</span>' + location + '</p>' : '') + '</div><div class="flex items-center gap-4 md:gap-6 shrink-0">' + badge + (price ? '<span class="text-2xl md:text-3xl lg:text-4xl font-serif text-white font-bold">' + price + '</span>' : '') + '</div></div></div></div>' : '') +
                '<div class="max-w-7xl mx-auto px-4 md:px-8 py-12 md:py-24">' +
                specsHtml +
                descHtml +
                dotazioniHtml +
                '<div class="mt-12 md:mt-16 pt-8 md:pt-12 border-t border-outline-variant/20 flex flex-col md:flex-row items-start md:items-center justify-between gap-6 md:gap-8"><div><span class="text-[10px] uppercase tracking-widest font-bold text-on-surface-variant">Interessato a questa proprietà?</span><p class="text-on-surface-variant text-xs md:text-sm mt-1">Richiedi maggiori informazioni o prenota una visita.</p></div><a href="contatti.html?richiesta=' + encodeURIComponent(p.titolo || '') + '" class="inline-flex items-center gap-3 bg-primary text-on-primary px-8 md:px-10 py-4 md:py-5 rounded-lg font-bold uppercase tracking-[0.2em] text-[10px] md:text-xs hover:bg-secondary transition-all shadow-xl whitespace-nowrap"><span class="material-symbols-outlined text-base">mail</span>Richiedi Informazioni</a></div>' +
                '</div>' +
                galleryHtml;
        })
        .catch(function() {
            root.innerHTML = '<div class="max-w-7xl mx-auto px-8 py-32 text-center"><span class="material-symbols-outlined text-5xl text-on-surface-variant/40 block mb-4">home</span><p class="text-lg text-on-surface-variant">Immobile non trovato.</p><a href="collection.html" class="inline-block mt-6 text-primary underline text-sm">Torna alla collezione</a></div>';
        });
});
</script>
