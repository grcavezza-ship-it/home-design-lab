<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Admin | Home Design Lab</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#005220',
                        'primary-container': '#186c32',
                        'on-primary': '#ffffff',
                        surface: '#fbf9f8',
                        'on-surface': '#1b1c1c',
                        'surface-container': '#f0eded',
                        error: '#ba1a1a',
                        success: '#2e7d32'
                    },
                    fontFamily: {
                        headline: ['Noto Serif'],
                        body: ['Manrope']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Manrope', sans-serif; }
        .font-serif { font-family: 'Noto Serif', serif; }
    </style>
    <link rel="icon" type="image/png" href="assets/images/Logo Home Design Lab.png"/>
</head>
<body class="bg-surface min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white p-8 shadow-xl border border-gray-200">
        <div class="text-center mb-8">
            <h1 class="font-serif text-3xl text-primary mb-2">Setup Admin</h1>
            <p class="text-gray-600 text-sm">Crea il primo account amministratore</p>
        </div>

        <form id="setupForm" class="space-y-6">
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-600 mb-2">Email Admin</label>
                <input type="email" id="adminEmail" value="info@homedesignlab.it" 
                       class="w-full px-4 py-3 border border-gray-300 focus:border-primary focus:outline-none text-sm"
                       required>
            </div>
            
            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-600 mb-2">Password</label>
                <input type="password" id="adminPassword" placeholder="Minimo 6 caratteri"
                       class="w-full px-4 py-3 border border-gray-300 focus:border-primary focus:outline-none text-sm"
                       minlength="6" required>
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-gray-600 mb-2">Conferma Password</label>
                <input type="password" id="confirmPassword" placeholder="Ripeti password"
                       class="w-full px-4 py-3 border border-gray-300 focus:border-primary focus:outline-none text-sm"
                       required>
            </div>

            <div id="message" class="hidden p-3 text-sm"></div>

            <button type="submit" 
                    class="w-full bg-primary text-white py-4 font-semibold text-xs uppercase tracking-wider hover:bg-primary-container transition-colors">
                Crea Admin
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="login.html" class="text-xs text-gray-500 hover:text-primary transition-colors">
                Torna al Login
            </a>
        </div>
        
        <!-- Metodo API Server -->
        <div class="mt-8 pt-6 border-t border-gray-200">
            <p class="text-xs text-gray-500 text-center mb-3">Metodo consigliato via server:</p>
            <button onclick="createAdminViaAPI()" class="w-full bg-green-600 text-white py-3 text-xs uppercase tracking-wider hover:bg-green-700 transition-colors">
                Crea Admin su Supabase
            </button>
            <p class="text-[10px] text-gray-400 text-center mt-2">
                Se Supabase non è configurato, userà la modalità demo
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Debug - verifica caricamento Supabase
        console.log('Supabase library loaded:', typeof window.supabase);
        
        // Inizializza Supabase
        const SUPABASE_URL = 'https://fjwcgawzjfhqzjgztfgg.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZqd2NnYXd6amZocXpqZ3p0ZmdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjk1NzQ0MzgsImV4cCI6MjA0NTE1MDQzOH0.qvJn-sxLr3J2i0X3xO1JdYk3m-7kXKzR0eF1bH2q0M';
        
        let supabase;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('Supabase client created successfully');
        } catch (e) {
            console.error('Failed to create Supabase client:', e);
            document.getElementById('message').textContent = 'Errore inizializzazione: ' + e.message;
            document.getElementById('message').className = 'p-3 text-sm bg-red-100 text-red-700 border border-red-300';
            document.getElementById('message').classList.remove('hidden');
        }

        document.getElementById('setupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const messageDiv = document.getElementById('message');
            
            // Validazione
            if (password !== confirmPassword) {
                showMessage('Le password non coincidono', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('La password deve essere di almeno 6 caratteri', 'error');
                return;
            }
            
            try {
                console.log('Attempting signup for:', email);
                
                // Verifica supabase esista
                if (!supabase) {
                    showMessage('Errore: Supabase non inizializzato. Ricarica la pagina.', 'error');
                    return;
                }
                
                // Registrazione utente
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            role: 'admin',
                            full_name: 'Admin Home Design Lab'
                        }
                    }
                });
                
                console.log('Signup response:', { data, error });
                
                if (error) {
                    console.error('Signup error:', error);
                    showMessage('Errore registrazione: ' + error.message, 'error');
                    return;
                }
                
                if (!data.user) {
                    showMessage('Errore: Utente non creato. Risposta vuota da Supabase.', 'error');
                    return;
                }
                
                console.log('User created:', data.user.id);
                
                // Crea profilo nella tabella profiles
                if (data.user) {
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .insert([
                            {
                                user_id: data.user.id,
                                email: email,
                                role: 'admin',
                                full_name: 'Admin Home Design Lab',
                                created_at: new Date().toISOString()
                            }
                        ]);
                    
                    if (profileError) {
                        console.log('Profile creation error:', profileError);
                        // Non bloccare se il profilo fallisce, l'utente è già creato
                    }
                }
                
                showMessage('Admin creato con successo! Controlla l\'email per la conferma, poi vai al login.', 'success');
                
                // Redirect dopo 3 secondi
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);
                
            } catch (error) {
                showMessage('Errore imprevisto: ' + error.message, 'error');
            }
        });
        
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'p-3 text-sm ' + 
                (type === 'error' 
                    ? 'bg-red-100 text-red-700 border border-red-300' 
                    : 'bg-green-100 text-green-700 border border-green-300');
            messageDiv.classList.remove('hidden');
        }
        
        // Metodo via API Supabase (reale)
        async function createAdminViaAPI() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showMessage('Le password non coincidono', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMessage('La password deve essere di almeno 6 caratteri', 'error');
                return;
            }
            
            try {
                showMessage('Creazione admin su Supabase...', 'info');
                
                // Prima prova con l'endpoint Supabase (app.py)
                let response = await fetch('/api/admin/create', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password,
                        full_name: 'Admin Home Design Lab'
                    })
                });
                
                let result = await response.json();
                
                // Se fallisce, prova con il fallback locale (app_simple.py)
                if (!response.ok && result.error && result.error.includes('non disponibile')) {
                    console.log('Supabase non disponibile, uso fallback locale...');
                    showMessage('Supabase non attivo, uso modalità demo...', 'info');
                    
                    response = await fetch('/api/setup-admin', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });
                    
                    result = await response.json();
                }
                
                if (response.ok && result.success) {
                    const msg = result.message || 'Admin creato!';
                    showMessage(msg + ' Email: ' + result.user.email + ' - Ora vai al login.', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } else {
                    showMessage('Errore: ' + (result.error || result.message || 'Errore sconosciuto'), 'error');
                }
                
            } catch (error) {
                console.error('Error:', error);
                showMessage('Errore connessione: ' + error.message, 'error');
            }
        }
    </script>
<script src="assets/js/cookie-banner.js"></script>
</body>
</html>
