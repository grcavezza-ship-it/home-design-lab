<script>
document.addEventListener('DOMContentLoaded', async function() {
 var params = new URLSearchParams(window.location.search);
 var id = params.get('id');
 if (!id) { mostraErrore(); return; }
 
 try {
 var r = await fetch('/api/articoli/' + encodeURIComponent(id));
 if (!r.ok) { mostraErrore(); return; }
 var a = await r.json();
 renderArticolo(a);
 } catch(e) {
 mostraErrore();
 }
 
 function renderArticolo(a) {
 document.getElementById('article-loading').classList.add('hidden');
 document.getElementById('article-content').classList.remove('hidden');
 
 document.title = (a.title || 'Articolo') + ' | Home Design Lab';
 var m = document.querySelector('meta[name="description"]');
 if (m) m.content = a.excerpt || 'Articolo del blog Home Design Lab';
 
 document.getElementById('article-category').textContent = a.category || 'Journal';
 document.getElementById('article-title').textContent = a.title || '';
 document.getElementById('article-excerpt').textContent = a.excerpt || '';
 
 var data = a.published_at || a.created_at || '';
 document.getElementById('article-date').textContent = data ? new Date(data).toLocaleDateString('it-IT', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
 
 if (a.cover_image) {
 document.getElementById('article-cover').classList.remove('hidden');
 document.getElementById('article-cover-img').src = a.cover_image;
 document.getElementById('article-cover-img').alt = a.title || '';
 }
 
 var bodyHtml = '';
 if (a.body) {
 if (typeof a.body === 'string') bodyHtml = a.body;
 else if (a.body.content) bodyHtml = a.body.content;
 }
 document.getElementById('article-body').innerHTML = bodyHtml || '<p class="text-on-surface-variant italic">Nessun contenuto.</p>';
 }
 
 function mostraErrore() {
 document.getElementById('article-loading').classList.add('hidden');
 document.getElementById('article-error').classList.remove('hidden');
 }
});
</script>
