<body class="bg-surface text-on-surface min-h-screen flex">

<!-- Sidebar (stessa struttura dashboard) -->
<aside class="w-64 bg-surface-container min-h-screen flex flex-col border-r border-outline/20">
  <div class="p-6 border-b border-outline/20"><a href="/"><img src="/assets/images/Logo Home Design Lab.png" alt="HDL" class="h-10 w-auto"></a></div>
  <nav class="flex-1 p-4 space-y-1">
    <a href="/operatore/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-surface-container-high text-on-surface font-label text-sm transition"><span class="material-symbols-outlined text-xl">dashboard</span>Dashboard</a>
    <a href="/operatore/clienti" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-surface-container-high text-on-surface font-label text-sm transition"><span class="material-symbols-outlined text-xl">people</span>Clienti</a>
    <a href="/operatore/portfolio" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-surface-container-high text-on-surface font-label text-sm transition"><span class="material-symbols-outlined text-xl">photo_library</span>Portfolio</a>
    <a href="/operatore/blog" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-primary text-on-primary font-label text-sm"><span class="material-symbols-outlined text-xl">article</span>Journal / Blog</a>
    <a href="/operatore/collection" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-surface-container-high text-on-surface font-label text-sm transition"><span class="material-symbols-outlined text-xl">apartment</span>Collection</a>
  </nav>
  <div class="p-4 border-t border-outline/20">
    <p class="text-sm font-semibold mb-1" data-user-name>Utente</p>
    <button data-action="logout" class="flex items-center gap-2 text-sm text-on-surface-variant hover:text-on-surface transition"><span class="material-symbols-outlined text-base">logout</span>Esci</button>
  </div>
</aside>

<!-- Main -->
<main class="flex-1 p-8">
  <header class="flex justify-between items-center mb-8">
    <div>
      <h1 class="font-headline text-3xl italic">Journal / Blog</h1>
      <p class="text-on-surface-variant text-sm mt-1">Gestisci gli articoli del blog pubblico</p>
    </div>
    <button id="btn-new-post" class="flex items-center gap-2 bg-primary text-on-primary px-5 py-3 rounded-lg font-label text-sm hover:bg-primary/90 transition">
      <span class="material-symbols-outlined text-base">add</span>Nuovo articolo
    </button>
  </header>

  <!-- Lista articoli -->
  <div id="posts-list" class="space-y-3">
    <p class="text-on-surface-variant text-sm">Caricamento...</p>
  </div>
</main>

<!-- Modal editor -->
<div id="modal-post" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
  <div class="bg-surface rounded-2xl w-full max-w-2xl p-8 shadow-2xl overflow-y-auto max-h-[90vh]">
    <h2 id="modal-title" class="font-headline text-2xl italic mb-6">Nuovo articolo</h2>
    <form id="form-post" class="space-y-4">
      <input type="hidden" id="post-id"/>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Titolo *</label>
        <input id="post-title" required class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low" placeholder="Titolo articolo"/></div>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Slug *</label>
        <input id="post-slug" required class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low" placeholder="titolo-articolo"/></div>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Categoria</label>
        <input id="post-category" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low" placeholder="es. design, sostenibilità"/></div>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Estratto</label>
        <textarea id="post-excerpt" rows="2" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low resize-none" placeholder="Breve descrizione..."></textarea></div>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Testo completo</label>
        <textarea id="post-body" rows="8" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low resize-none font-mono" placeholder="Testo dell'articolo..."></textarea></div>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Immagine di copertina (URL)</label>
        <input id="post-cover" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low" placeholder="https://..."/></div>
      <div class="flex items-center gap-3">
        <input type="checkbox" id="post-publish" class="w-4 h-4 text-primary focus:ring-0"/>
        <label for="post-publish" class="text-sm">Pubblica subito</label>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="flex-1 bg-primary text-on-primary py-3 rounded-lg font-label text-sm hover:bg-primary/90 transition">Salva</button>
        <button type="button" id="btn-close-modal" class="flex-1 border border-outline/30 py-3 rounded-lg font-label text-sm hover:bg-surface-container transition">Annulla</button>
      </div>
    </form>
  </div>
</div>

<script src="/assets/js/auth.js"></script>
<script>
var currentPosts = [];

function slugify(str) {
  return str.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').replace(/-+/g,'-');
}

function renderPosts(posts) {
  var list = document.getElementById('posts-list');
  if (!posts.length) { list.innerHTML = '<p class="text-on-surface-variant text-sm">Nessun articolo trovato.</p>'; return; }
  list.innerHTML = posts.map(function(p) {
    var badge = p.status==='published'
      ? '<span class="px-2 py-0.5 rounded text-xs bg-green-100 text-green-700">Pubblicato</span>'
      : '<span class="px-2 py-0.5 rounded text-xs bg-yellow-100 text-yellow-700">Bozza</span>';
    return '<div class="flex items-center justify-between bg-surface-container rounded-xl px-5 py-4 border border-outline/10">'
      + '<div class="flex items-center gap-4">' + badge
      + '<div><p class="font-semibold text-sm">' + p.title + '</p>'
      + '<p class="text-xs text-on-surface-variant mt-0.5">' + (p.category||'') + (p.published_at ? ' · ' + new Date(p.published_at).toLocaleDateString('it-IT') : '') + '</p></div></div>'
      + '<div class="flex gap-2">'
      + '<button onclick="editPost(\'' + p.id + '\')" class="p-2 rounded-lg hover:bg-surface-container-high transition"><span class="material-symbols-outlined text-sm">edit</span></button>'
      + '<button onclick="deletePost(\'' + p.id + '\')" class="p-2 rounded-lg hover:bg-red-50 text-red-500 transition"><span class="material-symbols-outlined text-sm">delete</span></button>'
      + '</div></div>';
  }).join('');
}

async function loadPosts() {
  try {
    var res = await HDL.authFetch('/api/operatore/blog');
    var data = await res.json();
    currentPosts = Array.isArray(data) ? data : [];
    renderPosts(currentPosts);
  } catch(e) { HDL.showNotification('Errore caricamento articoli','error'); }
}

function openModal(post) {
  document.getElementById('post-id').value      = post ? post.id : '';
  document.getElementById('post-title').value   = post ? post.title : '';
  document.getElementById('post-slug').value    = post ? post.slug : '';
  document.getElementById('post-category').value= post ? (post.category||'') : '';
  document.getElementById('post-excerpt').value = post ? (post.excerpt||'') : '';
  document.getElementById('post-body').value    = post ? (typeof post.body==='string' ? post.body : JSON.stringify(post.body,null,2)) : '';
  document.getElementById('post-cover').value   = post ? (post.cover_image||'') : '';
  document.getElementById('post-publish').checked = post ? post.status==='published' : false;
  document.getElementById('modal-title').textContent = post ? 'Modifica articolo' : 'Nuovo articolo';
  document.getElementById('modal-post').classList.remove('hidden');
}

function editPost(id) {
  var post = currentPosts.find(function(p){return p.id===id;});
  if (post) openModal(post);
}

async function deletePost(id) {
  if (!confirm('Eliminare questo articolo?')) return;
  try {
    await HDL.authFetch('/api/operatore/blog/'+id, {method:'DELETE'});
    HDL.showNotification('Articolo eliminato','success');
    loadPosts();
  } catch(e) { HDL.showNotification('Errore eliminazione','error'); }
}

document.addEventListener('DOMContentLoaded', function() {
  if (!HDL.isOperator()) return;
  loadPosts();

  document.getElementById('btn-new-post').onclick = function() { openModal(null); };
  document.getElementById('btn-close-modal').onclick = function() { document.getElementById('modal-post').classList.add('hidden'); };

  var titleInput = document.getElementById('post-title');
  titleInput.addEventListener('input', function() {
    var slugEl = document.getElementById('post-slug');
    if (!slugEl.dataset.manual) slugEl.value = slugify(titleInput.value);
  });
  document.getElementById('post-slug').addEventListener('input', function() {
    this.dataset.manual = '1';
  });

  document.getElementById('form-post').addEventListener('submit', async function(e) {
    e.preventDefault();
    var id = document.getElementById('post-id').value;
    var body = {
      title:       document.getElementById('post-title').value,
      slug:        document.getElementById('post-slug').value,
      category:    document.getElementById('post-category').value,
      excerpt:     document.getElementById('post-excerpt').value,
      body:        { content: document.getElementById('post-body').value },
      cover_image: document.getElementById('post-cover').value,
      status:      document.getElementById('post-publish').checked ? 'published' : 'draft'
    };
    try {
      var method = id ? 'PUT' : 'POST';
      var url    = id ? '/api/operatore/blog/'+id : '/api/operatore/blog';
      await HDL.authFetch(url, { method: method, body: JSON.stringify(body) });
      HDL.showNotification(id ? 'Articolo aggiornato' : 'Articolo creato','success');
      document.getElementById('modal-post').classList.add('hidden');
      loadPosts();
    } catch(err) { HDL.showNotification('Errore salvataggio','error'); }
  });
});
</script>
</body>
</html>
