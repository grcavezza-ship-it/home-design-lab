<body class="bg-surface text-on-surface min-h-screen flex">
<aside class="w-64 bg-surface-container min-h-screen flex flex-col border-r border-outline/20">
  <div class="p-6 border-b border-outline/20"><a href="/"><img src="/assets/images/Logo Home Design Lab.png" alt="HDL" class="h-10 w-auto"></a></div>
  <nav class="flex-1 p-4 space-y-1">
    <a href="/operatore/dashboard" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-surface-container-high text-on-surface font-label text-sm transition"><span class="material-symbols-outlined text-xl">dashboard</span>Dashboard</a>
    <a href="/operatore/clienti" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-primary text-on-primary font-label text-sm"><span class="material-symbols-outlined text-xl">people</span>Clienti</a>
    <a href="/operatore/portfolio" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-surface-container-high text-on-surface font-label text-sm transition"><span class="material-symbols-outlined text-xl">photo_library</span>Portfolio</a>

    <a href="/operatore/collection" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-surface-container-high text-on-surface font-label text-sm transition"><span class="material-symbols-outlined text-xl">apartment</span>Collection</a>
  </nav>
  <div class="p-4 border-t border-outline/20">
    <p class="text-sm font-semibold mb-1" data-user-name>Utente</p>
    <button data-action="logout" class="flex items-center gap-2 text-sm text-on-surface-variant hover:text-on-surface transition"><span class="material-symbols-outlined text-base">logout</span>Esci</button>
  </div>
</aside>
<main class="flex-1 p-8">
  <header class="flex justify-between items-center mb-8">
    <div><h1 class="font-headline text-3xl italic">Gestione Clienti</h1><p class="text-on-surface-variant text-sm mt-1">Lista clienti e upload documenti</p></div>
    <button id="btn-new" class="flex items-center gap-2 bg-primary text-on-primary px-5 py-3 rounded-lg font-label text-sm hover:bg-primary/90 transition"><span class="material-symbols-outlined text-base">person_add</span>Nuovo cliente</button>
  </header>

  <!-- Ricerca -->
  <div class="mb-6"><input id="search" type="search" placeholder="Cerca cliente..." class="w-full max-w-md border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low"/></div>

  <div id="items-list" class="space-y-3"><p class="text-on-surface-variant text-sm">Caricamento...</p></div>
</main>

<!-- Modal nuovo/modifica cliente -->
<div id="modal-client" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
  <div class="bg-surface rounded-2xl w-full max-w-xl p-8 shadow-2xl">
    <h2 id="modal-title" class="font-headline text-2xl italic mb-6">Nuovo cliente</h2>
    <form id="form-client" class="space-y-4">
      <input type="hidden" id="client-id"/>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Nome / Ragione sociale *</label><input id="client-name" required class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low"/></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Email fatturazione</label><input id="client-email" type="email" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low"/></div>
        <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Telefono</label><input id="client-phone" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low"/></div>
      </div>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Note interne</label><textarea id="client-notes" rows="3" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low resize-none"></textarea></div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="flex-1 bg-primary text-on-primary py-3 rounded-lg font-label text-sm">Salva</button>
        <button type="button" id="btn-close-client" class="flex-1 border border-outline/30 py-3 rounded-lg font-label text-sm hover:bg-surface-container transition">Annulla</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal upload documento -->
<div id="modal-upload" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
  <div class="bg-surface rounded-2xl w-full max-w-md p-8 shadow-2xl">
    <h2 class="font-headline text-2xl italic mb-6">Carica documento</h2>
    <form id="form-upload" class="space-y-4">
      <input type="hidden" id="upload-client-id"/>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Titolo documento</label><input id="upload-title" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low" placeholder="es. Planimetria piano terra"/></div>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">File</label><input id="upload-file" type="file" required class="w-full text-sm"/></div>
      <div class="flex items-center gap-3"><input type="checkbox" id="upload-visible" class="w-4 h-4 text-primary focus:ring-0"/><label for="upload-visible" class="text-sm">Visibile al cliente</label></div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="flex-1 bg-primary text-on-primary py-3 rounded-lg font-label text-sm">Carica</button>
        <button type="button" id="btn-close-upload" class="flex-1 border border-outline/30 py-3 rounded-lg font-label text-sm hover:bg-surface-container transition">Annulla</button>
      </div>
    </form>
  </div>
</div>

<script src="/assets/js/auth.js"></script>
<script>
var clients = [];

function render(list) {
  var el=document.getElementById('items-list');
  if(!list.length){el.innerHTML='<p class="text-on-surface-variant text-sm">Nessun cliente trovato.</p>';return;}
  el.innerHTML=list.map(function(c){
    return '<div class="flex items-center justify-between bg-surface-container rounded-xl px-5 py-4 border border-outline/10">'
      +'<div><p class="font-semibold text-sm">'+c.legal_name+'</p><p class="text-xs text-on-surface-variant mt-0.5">'+(c.billing_email||'')+(c.phone?' · '+c.phone:'')+'</p></div>'
      +'<div class="flex gap-2">'
      +'<a href="/operatore/clienti/'+c.id+'" class="p-2 rounded-lg hover:bg-surface-container-high transition" title="Dettaglio"><span class="material-symbols-outlined text-sm">open_in_new</span></a>'
      +'<button onclick="openUpload(\''+c.id+'\')" class="p-2 rounded-lg hover:bg-surface-container-high transition" title="Carica file"><span class="material-symbols-outlined text-sm">upload_file</span></button>'
      +'<button onclick="edit(\''+c.id+'\')" class="p-2 rounded-lg hover:bg-surface-container-high transition"><span class="material-symbols-outlined text-sm">edit</span></button>'
      +'</div></div>';
  }).join('');
}

async function load(){
  try{var r=await HDL.authFetch('/api/operatore/clienti');clients=await r.json();clients=Array.isArray(clients)?clients:[];render(clients);}
  catch(e){HDL.showNotification('Errore caricamento','error');}
}

function openModal(item){
  document.getElementById('client-id').value=item?item.id:'';
  document.getElementById('client-name').value=item?item.legal_name:'';
  document.getElementById('client-email').value=item?(item.billing_email||''):'';
  document.getElementById('client-phone').value=item?(item.phone||''):'';
  document.getElementById('client-notes').value=item?(item.notes_internal||''):'';
  document.getElementById('modal-title').textContent=item?'Modifica cliente':'Nuovo cliente';
  document.getElementById('modal-client').classList.remove('hidden');
}
function edit(id){openModal(clients.find(function(x){return x.id===id;}));}

function openUpload(clientId){
  document.getElementById('upload-client-id').value=clientId;
  document.getElementById('modal-upload').classList.remove('hidden');
}

document.addEventListener('DOMContentLoaded',function(){
  if(!HDL.isOperator())return;
  load();

  document.getElementById('btn-new').onclick=function(){openModal(null);};
  document.getElementById('btn-close-client').onclick=function(){document.getElementById('modal-client').classList.add('hidden');};
  document.getElementById('btn-close-upload').onclick=function(){document.getElementById('modal-upload').classList.add('hidden');};

  // Ricerca live
  document.getElementById('search').addEventListener('input',function(){
    var q=this.value.toLowerCase();
    render(clients.filter(function(c){return c.legal_name.toLowerCase().includes(q);}));
  });

  document.getElementById('form-client').addEventListener('submit',async function(e){
    e.preventDefault();
    var id=document.getElementById('client-id').value;
    var body={legal_name:document.getElementById('client-name').value,billing_email:document.getElementById('client-email').value,phone:document.getElementById('client-phone').value,notes_internal:document.getElementById('client-notes').value};
    var method=id?'PUT':'POST',url=id?'/api/operatore/clienti/'+id:'/api/operatore/clienti';
    try{await HDL.authFetch(url,{method:method,body:JSON.stringify(body)});HDL.showNotification('Salvato','success');document.getElementById('modal-client').classList.add('hidden');load();}
    catch(err){HDL.showNotification('Errore','error');}
  });

  document.getElementById('form-upload').addEventListener('submit',async function(e){
    e.preventDefault();
    var clientId=document.getElementById('upload-client-id').value;
    var file=document.getElementById('upload-file').files[0];
    var title=document.getElementById('upload-title').value;
    var visible=document.getElementById('upload-visible').checked;
    if(!file)return;
    var fd=new FormData();
    fd.append('file',file);
    fd.append('title',title||file.name);
    fd.append('visibility',visible?'client_visible':'internal');
    try{
      var token=HDL.getToken();
      var r=await fetch('/api/operatore/clienti/'+clientId+'/documenti',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});
      if(!r.ok)throw new Error('Upload fallito');
      HDL.showNotification('File caricato','success');
      document.getElementById('modal-upload').classList.add('hidden');
      document.getElementById('form-upload').reset();
    }catch(err){HDL.showNotification('Errore upload: '+err.message,'error');}
  });
});
</script>
</body>
</html>
