<body class="bg-surface text-on-surface min-h-screen flex">
<aside class="w-64 bg-surface-container min-h-screen flex flex-col border-r border-outline/20">
  <div class="p-6 border-b border-outline/20"><a href="/"><img src="/assets/images/Logo Home Design Lab.png" alt="HDL" class="h-10 w-auto"></a></div>

    <a href="/operatore/blog" class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-surface-container-high text-on-surface font-label text-sm transition"><span class="material-symbols-outlined text-xl">article</span>Journal / Blog</a>

  </nav>
  <div class="p-4 border-t border-outline/20">
    <p class="text-sm font-semibold mb-1" data-user-name>Utente</p>
    <button data-action="logout" class="flex items-center gap-2 text-sm text-on-surface-variant hover:text-on-surface transition"><span class="material-symbols-outlined text-base">logout</span>Esci</button>
  </div>

<main class="flex-1 p-8">
  <header class="flex justify-between items-center mb-8">
    <div><h1 class="font-headline text-3xl italic">Portfolio</h1><p class="text-on-surface-variant text-sm mt-1">Gestisci i progetti del sito pubblico</p></div>
    <button id="btn-new" class="flex items-center gap-2 bg-primary text-on-primary px-5 py-3 rounded-lg font-label text-sm hover:bg-primary/90 transition"><span class="material-symbols-outlined text-base">add</span>Nuovo progetto</button>
  </header>
  <div id="items-list" class="space-y-3"><p class="text-on-surface-variant text-sm">Caricamento...</p></div>
</main>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
  <div class="bg-surface rounded-2xl w-full max-w-2xl p-8 shadow-2xl overflow-y-auto max-h-[90vh]">
    <h2 id="modal-title" class="font-headline text-2xl italic mb-6">Nuovo progetto</h2>
    <form id="form-item" class="space-y-4">
      <input type="hidden" id="item-id"/>
      <!-- Selettore cliente -->
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Cliente *</label>
        <select id="item-client" required class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low"><option value="">Seleziona cliente...</option></select></div>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Titolo *</label>
        <input id="item-title" required class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low"/></div>
      <div class="grid grid-cols-2 gap-4">
        <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Categoria</label>
          <input id="item-category" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low" placeholder="residenziale"/></div>
        <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Località</label>
          <input id="item-location" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low"/></div>
      </div>
      <div class="grid grid-cols-3 gap-4">
        <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Superficie</label><input id="item-surface" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low" placeholder="120mq"/></div>
        <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Durata</label><input id="item-duration" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low" placeholder="6 mesi"/></div>
        <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Budget (EUR)</label><input id="item-budget" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low" placeholder="80.000"/></div>
      </div>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Descrizione</label>
        <textarea id="item-description" rows="3" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low resize-none"></textarea></div>
      <div><label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-1">Immagine copertina (URL)</label>
        <input id="item-cover" class="w-full border border-outline/30 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-primary bg-surface-container-low"/></div>
      <div class="flex items-center gap-3"><input type="checkbox" id="item-public" class="w-4 h-4 text-primary focus:ring-0"/><label for="item-public" class="text-sm">Visibile sul sito pubblico</label></div>
      <div class="flex gap-3 pt-2">
        <button type="submit" class="flex-1 bg-primary text-on-primary py-3 rounded-lg font-label text-sm hover:bg-primary/90 transition">Salva</button>
        <button type="button" id="btn-close" class="flex-1 border border-outline/30 py-3 rounded-lg font-label text-sm hover:bg-surface-container transition">Annulla</button>
      </div>
    </form>
  </div>
</div>

<script src="/assets/js/auth.js"></script>
<script>
var items = [], clients = [];

function render(list) {
  var el = document.getElementById('items-list');
  if (!list.length) { el.innerHTML='<p class="text-on-surface-variant text-sm">Nessun progetto.</p>'; return; }
  el.innerHTML = list.map(function(p) {
    var pub = p.is_public ? '<span class="px-2 py-0.5 rounded text-xs bg-green-100 text-green-700">Pubblico</span>' : '<span class="px-2 py-0.5 rounded text-xs bg-gray-100 text-gray-600">Privato</span>';
    return '<div class="flex items-center justify-between bg-surface-container rounded-xl px-5 py-4 border border-outline/10">'
      +'<div class="flex items-center gap-4">'+pub+'<div><p class="font-semibold text-sm">'+p.title+'</p><p class="text-xs text-on-surface-variant mt-0.5">'+(p.category||'')+(p.location?' · '+p.location:'')+'</p></div></div>'
      +'<div class="flex gap-2"><button onclick="edit(\''+p.id+'\')" class="p-2 rounded-lg hover:bg-surface-container-high transition"><span class="material-symbols-outlined text-sm">edit</span></button>'
      +'<button onclick="del(\''+p.id+'\')" class="p-2 rounded-lg hover:bg-red-50 text-red-500 transition"><span class="material-symbols-outlined text-sm">delete</span></button></div></div>';
  }).join('');
}

async function load() {
  try {
    var [r1,r2] = await Promise.all([HDL.authFetch('/api/operatore/portfolio'), HDL.authFetch('/api/operatore/clienti')]);
    items   = await r1.json(); items   = Array.isArray(items)   ? items   : [];
    clients = await r2.json(); clients = Array.isArray(clients) ? clients : [];
    render(items);
    var sel = document.getElementById('item-client');
    clients.forEach(function(c) { var o=document.createElement('option'); o.value=c.id; o.textContent=c.legal_name; sel.appendChild(o); });
  } catch(e) { HDL.showNotification('Errore caricamento','error'); }
}

function open(item) {
  document.getElementById('item-id').value          = item?item.id:'';
  document.getElementById('item-title').value       = item?item.title:'';
  document.getElementById('item-category').value    = item?(item.category||''):'';
  document.getElementById('item-location').value    = item?(item.location||''):'';
  document.getElementById('item-surface').value     = item?(item.surface||''):'';
  document.getElementById('item-duration').value    = item?(item.duration||''):'';
  document.getElementById('item-budget').value      = item?(item.budget||''):'';
  document.getElementById('item-description').value = item?(item.description||''):'';
  document.getElementById('item-cover').value       = item?(item.cover_image||''):'';
  document.getElementById('item-public').checked    = item?Boolean(item.is_public):false;
  document.getElementById('item-client').value      = item?(item.client_id||''):'';
  document.getElementById('modal-title').textContent = item?'Modifica progetto':'Nuovo progetto';
  document.getElementById('modal').classList.remove('hidden');
}
function edit(id) { open(items.find(function(x){return x.id===id;})); }
async function del(id) {
  if (!confirm('Eliminare?')) return;
  await HDL.authFetch('/api/operatore/portfolio/'+id,{method:'DELETE'});
  HDL.showNotification('Eliminato','success'); load();
}

document.addEventListener('DOMContentLoaded', function(){
  if (!HDL.isOperator()) return;
  load();
  document.getElementById('btn-new').onclick = function(){ open(null); };
  document.getElementById('btn-close').onclick = function(){ document.getElementById('modal').classList.add('hidden'); };
  document.getElementById('form-item').addEventListener('submit', async function(e){
    e.preventDefault();
    var id = document.getElementById('item-id').value;
    var body = { title:document.getElementById('item-title').value, category:document.getElementById('item-category').value, location:document.getElementById('item-location').value, surface:document.getElementById('item-surface').value, duration:document.getElementById('item-duration').value, budget:document.getElementById('item-budget').value, description:document.getElementById('item-description').value, cover_image:document.getElementById('item-cover').value, is_public:document.getElementById('item-public').checked, client_id:document.getElementById('item-client').value };
    var method = id?'PUT':'POST', url = id?'/api/operatore/portfolio/'+id:'/api/operatore/portfolio';
    try { await HDL.authFetch(url,{method:method,body:JSON.stringify(body)}); HDL.showNotification('Salvato','success'); document.getElementById('modal').classList.add('hidden'); load(); }
    catch(err){ HDL.showNotification('Errore','error'); }
  });
});
</script>
</body>
</html>
