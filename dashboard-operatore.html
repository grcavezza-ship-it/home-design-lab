<script>
function formatDate(dateStr) {
    if (!dateStr) return null;
    var d = new Date(dateStr);
    if (isNaN(d.getTime())) return null;
    var opts = { day: 'numeric', month: 'short' };
    return d.toLocaleDateString('it-IT', opts);
}

function daysUntil(dateStr) {
    if (!dateStr) return null;
    var now = new Date();
    now.setHours(0,0,0,0);
    var d = new Date(dateStr);
    d.setHours(0,0,0,0);
    var diff = Math.ceil((d - now) / (1000 * 60 * 60 * 24));
    return diff;
}

async function loadDashboardData() {
    await new Promise(function(resolve) {
        var check = function() {
            if (window.currentUserRole && window.supabase) { resolve(); }
            else { setTimeout(check, 100); }
        };
        check();
    });

    var role = window.currentUserRole || 'client';
    var isRestricted = role === 'operator' || role === 'architect';
    var assignedTitles = [];

    if (isRestricted && window.currentUserPermissions) {
        var scope = window.currentUserPermissions.scope;
        if (scope === 'assigned' && window.currentUserAssignedProjects && window.currentUserAssignedProjects.length > 0) {
            assignedTitles = window.currentUserAssignedProjects;
        }
    }

    var { data: projects, error } = await window.supabase
        .from('projects')
        .select('id, titolo, status, drive_folder_id, avanzamento, data_consegna')
        .order('created_at', { ascending: false });

    if (error) { console.error('[Dashboard] Errore caricamento progetti:', error.message); return; }

    if (assignedTitles.length > 0) {
        projects = projects.filter(function(p) { return assignedTitles.includes(p.titolo); });
    }

    var progettiCount = document.getElementById('stats-progetti-count');
    if (progettiCount) progettiCount.textContent = String(projects.length).padStart(2, '0');

    var inEsecuzione = projects.filter(function(p) { return p.status === 'active' || p.status === 'on_hold' || p.status === 'attivo'; });
    var inEsecEl = document.getElementById('stats-in-esecuzione');
    if (inEsecEl) inEsecEl.textContent = String(inEsecuzione.length).padStart(2, '0');

    var nextTitle = document.getElementById('stats-next-title');
    var nextDate = document.getElementById('stats-next-date');

    var withDeadline = projects.filter(function(p) { return p.data_consegna; });
    if (withDeadline.length > 0) {
        withDeadline.sort(function(a, b) { return new Date(a.data_consegna) - new Date(b.data_consegna); });
        var nearest = withDeadline[0];
        if (nextTitle) nextTitle.textContent = nearest.titolo;
        var days = daysUntil(nearest.data_consegna);
        var formatted = formatDate(nearest.data_consegna);
        if (days !== null && days <= 0) {
            if (nextDate) nextDate.textContent = 'Scaduto il ' + formatted;
        } else if (days !== null && days <= 7) {
            if (nextDate) nextDate.textContent = 'Tra ' + days + ' giorni (' + formatted + ')';
        } else if (days !== null) {
            if (nextDate) nextDate.textContent = 'Consegna: ' + formatted;
        }
    } else if (projects.length > 0) {
        if (nextTitle) nextTitle.textContent = projects[0].titolo;
        if (nextDate) nextDate.textContent = 'Nessuna scadenza impostata';
    }

    var container = document.getElementById('projects-list-container');
    if (!container) return;
    container.innerHTML = '';
    if (projects.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-on-surface-variant font-label text-sm">Nessun progetto assegnato</div>';
        return;
    }

    var iconSet = ['domain', 'park', 'balcony', 'apartment', 'villa', 'cottage', 'roofing', 'deck', 'grass', 'architecture'];
    var statusColors = {
        active: { bg: 'bg-surface-container-low', text: 'text-on-surface-variant', label: 'In Corso' },
        attivo: { bg: 'bg-surface-container-low', text: 'text-on-surface-variant', label: 'In Corso' },
        on_hold: { bg: 'bg-tertiary/10', text: 'text-tertiary', label: 'In Attesa' },
        completed: { bg: 'bg-surface-container', text: 'text-outline', label: 'Completato' },
        draft: { bg: 'bg-surface-container-high', text: 'text-outline', label: 'Bozza' },
        archived: { bg: 'bg-surface-container', text: 'text-outline', label: 'Archiviato' }
    };

    projects.forEach(function(p, idx) {
        var icon = iconSet[idx % iconSet.length];
        var sc = statusColors[p.status] || statusColors.active;
        var projectId = p.id ? String(p.id) : '';
        var projectTitle = p.titolo || 'Progetto';
        var progress = (typeof p.avanzamento === 'number') ? p.avanzamento : 0;
        var progressBg = (progress >= 100) ? 'bg-outline-variant' : 'bg-primary';

        var row = document.createElement('div');
        row.className = 'bg-surface-container-lowest rounded-xl p-6 shadow-[0px_10px_30px_rgba(27,28,28,0.03)] flex flex-col md:flex-row md:items-center justify-between gap-6 hover:-translate-y-1 transition-transform duration-300';
        if (p.status === 'archived') row.classList.add('opacity-75');

        row.innerHTML =
            '<div class="flex items-center gap-6 md:w-1/3">' +
                '<div class="h-12 w-12 rounded-lg bg-surface-container-high flex items-center justify-center text-primary">' +
                    '<span class="material-symbols-outlined">' + icon + '</span>' +
                '</div>' +
                '<div>' +
                    '<a href="dettaglio-progetto.html?id=' + projectId + '" class="font-headline text-lg text-on-surface leading-tight hover:text-primary transition-colors">' + projectTitle + '</a>' +
                    '<p class="font-label text-sm text-on-surface-variant mt-1">' + projectId.substring(0, 8) + '</p>' +
                '</div>' +
            '</div>' +
            '<div class="flex-1 max-w-md">' +
                '<div class="flex justify-between font-label text-xs text-on-surface-variant mb-2">' +
                    '<span>Avanzamento</span>' +
                    '<span class="font-bold text-on-surface">' + progress + '%</span>' +
                '</div>' +
                '<div class="h-2 w-full bg-surface-container rounded-full overflow-hidden">' +
                    '<div class="h-full ' + progressBg + ' rounded-full relative" style="width:' + progress + '%">' +
                        '<div class="absolute top-0 right-0 bottom-0 w-8 bg-gradient-to-l from-white/20 to-transparent"></div>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="flex items-center gap-3 md:w-1/6 justify-end">' +
                '<span class="px-3 py-1 ' + sc.bg + ' ' + sc.text + ' rounded-md font-label text-xs tracking-wider uppercase">' + sc.label + '</span>' +
                (p.drive_folder_id
                    ? '<a href="https://drive.google.com/drive/folders/' + p.drive_folder_id + '" target="_blank" class="h-10 w-10 rounded-md bg-surface-container-highest flex items-center justify-center text-primary hover:bg-surface-dim hover:bg-gray-100 transition-colors group" title="Apri in Google Drive"><span class="material-symbols-outlined text-[20px] group-hover:scale-110 transition-transform">add_to_drive</span></a>'
                    : '') +
            '</div>';

        container.appendChild(row);
    });
}

document.addEventListener('DOMContentLoaded', function() {
    loadDashboardData();

    var avatarBtn = document.getElementById('avatar-btn');
    var avatarDropdown = document.getElementById('avatar-dropdown');
    var dropdownLogout = document.getElementById('dropdown-logout');

    if (avatarBtn) {
        avatarBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            avatarDropdown.classList.toggle('hidden');
        });
    }

    document.addEventListener('click', function() {
        if (avatarDropdown) avatarDropdown.classList.add('hidden');
    });

    if (dropdownLogout) {
        dropdownLogout.addEventListener('click', async function(e) {
            e.preventDefault();
            if (window.supabase) {
                await window.supabase.auth.signOut();
            }
            localStorage.clear();
            window.location.href = 'templates/login.html';
        });
    }
});
    // Mobile sidebar toggle
    var menuToggle = document.getElementById('mobile-menu-toggle');
    var sidebar = document.getElementById('sidebar-menu');
    var overlay = document.getElementById('mobile-sidebar-overlay');
    function openSidebar() {
        sidebar.classList.remove('-translate-x-full');
        sidebar.classList.add('translate-x-0');
        overlay.classList.remove('hidden');
        if (menuToggle) menuToggle.querySelector('.material-symbols-outlined').textContent = 'close';
    }
    function closeSidebar() {
        sidebar.classList.add('-translate-x-full');
        sidebar.classList.remove('translate-x-0');
        overlay.classList.add('hidden');
        if (menuToggle) menuToggle.querySelector('.material-symbols-outlined').textContent = 'menu';
    }
    if (menuToggle) {
        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            var isOpen = !sidebar.classList.contains('-translate-x-full');
            if (isOpen) closeSidebar();
            else openSidebar();
        });
    }
    if (overlay) overlay.addEventListener('click', closeSidebar);
    function checkScreenSize() {
        if (window.innerWidth >= 1024) {
            sidebar.classList.remove('-translate-x-full');
            sidebar.classList.remove('translate-x-0');
            overlay.classList.add('hidden');
            if (menuToggle) menuToggle.querySelector('.material-symbols-outlined').textContent = 'menu';
        } else {
            closeSidebar();
        }
    }
    window.addEventListener('resize', checkScreenSize);
</script>
