<!DOCTYPE html>
<html class="light" lang="it">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Gestione Cantieri - Home Design Lab</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#186C32",
                        "secondary": "#4CAF50",
                        "tertiary": "#D4BFA7",
                        "on-primary": "#ffffff",
                        "surface": "#fbf9f8",
                        "on-surface": "#1b1c1c",
                        "background": "#fbf9f8",
                        "outline": "#707a6e",
                        "surface-container": "#f0eded",
                        "surface-container-low": "#f6f3f2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Noto Serif"],
                        "body": ["Manrope"],
                        "label": ["Manrope"]
                    }
                },
            },
        }
    </script>
    <style>
        body { font-family: 'Manrope', sans-serif; }
        .font-serif { font-family: 'Noto Serif', serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased">
    <!-- Navigation -->
    <nav class="bg-surface-container border-b border-outline/20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <h1 class="text-xl font-bold text-primary">Home Design Lab</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="admin.html" class="text-on-surface hover:text-primary">
                        <span class="material-symbols-outlined align-middle mr-1">dashboard</span>
                        Dashboard
                    </a>
                    <a href="#" class="text-primary font-medium">
                        <span class="material-symbols-outlined align-middle mr-1">business</span>
                        Cantieri
                    </a>
                    <button onclick="logout()" class="text-red-600 hover:text-red-800">
                        <span class="material-symbols-outlined align-middle">logout</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div id="cantieri-list">
            <!-- Content will be loaded here by JavaScript -->
        </div>
    </main>

    <!-- Cantiere Form Modal -->
    <div id="cantiere-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-surface rounded-lg max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">Nuovo Cantiere</h2>
                    <button onclick="cantieriAdmin.closeModal('cantiere-modal')" 
                            class="text-gray-500 hover:text-gray-700">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <form id="cantiere-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Nome Progetto *</label>
                        <input type="text" name="nome_progetto" required
                               class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Indirizzo</label>
                        <input type="text" name="indirizzo"
                               class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Data Inizio</label>
                        <input type="date" name="data_inizio"
                               class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Google Drive Folder ID</label>
                        <input type="text" name="drive_folder_id" 
                               placeholder="es. 1ABC123XYZ..."
                               class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <p class="text-xs text-gray-500 mt-1">
                            Incolla l'ID della cartella Google Drive dal link (es. drive.google.com/drive/folders/ID_CART)
                        </p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Riferimenti</label>
                        <textarea name="riferimenti" rows="3"
                                  class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Stato</label>
                        <select name="stato" 
                                class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            <option value="attivo">Attivo</option>
                            <option value="completato">Completato</option>
                            <option value="sospeso">Sospeso</option>
                        </select>
                    </div>

                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" onclick="cantieriAdmin.closeModal('cantiere-modal')"
                                class="px-4 py-2 border border-outline/30 rounded-lg hover:bg-surface-container">
                            Annulla
                        </button>
                        <button type="submit"
                                class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90">
                            Salva Cantiere
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Task Form Modal -->
    <div id="task-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-surface rounded-lg max-w-md w-full mx-4">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">Nuovo Task</h2>
                    <button onclick="cantieriAdmin.closeModal('task-modal')" 
                            class="text-gray-500 hover:text-gray-700">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <form id="task-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Descrizione Task *</label>
                        <input type="text" name="descrizione" required
                               class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Categoria</label>
                        <select name="categoria"
                                class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            <option value="generale">Generale</option>
                            <option value="rilievo">Rilievo</option>
                            <option value="impiantistica">Impiantistica</option>
                            <option value="sicurezza">Sicurezza</option>
                            <option value="strutturale">Strutturale</option>
                            <option value="finiture">Finiture</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Priorità</label>
                        <select name="priorita"
                                class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            <option value="bassa">Bassa</option>
                            <option value="media">Media</option>
                            <option value="alta">Alta</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Assegnato a</label>
                        <select name="operatore_id"
                                class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            <option value="">Seleziona operatore</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Note</label>
                        <textarea name="note" rows="3"
                                  class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
                    </div>

                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" onclick="cantieriAdmin.closeModal('task-modal')"
                                class="px-4 py-2 border border-outline/30 rounded-lg hover:bg-surface-container">
                            Annulla
                        </button>
                        <button type="submit"
                                class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90">
                            Salva Task
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Assignment Form Modal -->
    <div id="assignment-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-surface rounded-lg max-w-md w-full mx-4">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">Assegna Operatore</h2>
                    <button onclick="cantieriAdmin.closeModal('assignment-modal')" 
                            class="text-gray-500 hover:text-gray-700">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>

                <form id="assignment-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Operatore *</label>
                        <select name="operatore_id" required
                                class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            <option value="">Seleziona operatore</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Ruolo</label>
                        <select name="ruolo"
                                class="w-full px-3 py-2 border border-outline/30 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                            <option value="operatore">Operatore</option>
                            <option value="responsabile">Responsabile</option>
                            <option value="supervisore">Supervisore</option>
                        </select>
                    </div>

                    <div class="flex justify-end space-x-3 pt-4">
                        <button type="button" onclick="cantieriAdmin.closeModal('assignment-modal')"
                                class="px-4 py-2 border border-outline/30 rounded-lg hover:bg-surface-container">
                            Annulla
                        </button>
                        <button type="submit"
                                class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90">
                            Assegna
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Cantiere Detail Modal -->
    <div id="cantiere-detail-modal">
        <!-- Content will be dynamically generated -->
    </div>

    <!-- Scripts -->
    <script>
        // Supabase configuration
        const supabaseUrl = 'https://your-project.supabase.co';
        const supabaseKey = 'your-anon-key';
        
        // Initialize Supabase
        window.supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Load environment variables
        fetch('./config.js')
            .then(response => response.json())
            .then(config => {
                if (config.supabaseUrl && config.supabaseAnonKey) {
                    window.supabase = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
                }
            })
            .catch(err => console.log('Using fallback Supabase config'));

        // Logout function
        async function logout() {
            await supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        // Check authentication
        async function checkAuth() {
            const { data: { user }, error } = await supabase.auth.getUser();
            
            if (!user || error) {
                window.location.href = 'login.html';
                return false;
            }

            // Check if user is admin
            const { data: profile } = await supabase
                .from('profiles')
                .select('role')
                .eq('user_id', user.id)
                .single();

            if (!profile || profile.role !== 'admin') {
                alert('Accesso negato. Solo gli amministratori possono accedere a questa pagina.');
                window.location.href = 'dashboard.html';
                return false;
            }

            return true;
        }

        // Initialize app
        document.addEventListener('DOMContentLoaded', async () => {
            const isAuthenticated = await checkAuth();
            if (isAuthenticated) {
                // Load the Google Drive integration script first
                const driveScript = document.createElement('script');
                driveScript.src = './google-drive-integration.js';
                driveScript.onload = () => {
                    console.log('Google Drive integration loaded');
                };
                document.head.appendChild(driveScript);
                
                // Load the cantieri admin script
                const script = document.createElement('script');
                script.src = './cantieri-admin.js';
                script.onload = () => {
                    console.log('Cantieri admin loaded');
                };
                document.head.appendChild(script);
            }
        });
    </script>
</body>
</html>
