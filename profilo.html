<script>

</script>
<script src="assets/js/portal-init.js"></script>
<script>
var docs = [];

document.addEventListener('DOMContentLoaded', async function() {
    var avatarUploadInput = document.getElementById('avatar-upload-input');
    var uploadAvatarBtn = document.getElementById('upload-avatar-btn');
    var profileAvatarBtn = document.getElementById('profile-avatar-btn');
    var profileAvatarImg = document.getElementById('profile-avatar-img');
    var profileAvatarInitials = document.getElementById('profile-avatar-initials');
    var profileForm = document.getElementById('profile-form');
    var btnSalva = document.getElementById('btn-salva');
    var docUploadInput = document.getElementById('doc-upload-input');
    var btnUploadDoc = document.getElementById('btn-upload-doc');

    uploadAvatarBtn.addEventListener('click', function() { avatarUploadInput.click(); });
    profileAvatarBtn.addEventListener('click', function() { avatarUploadInput.click(); });

    avatarUploadInput.addEventListener('change', async function(e) {
        if (e.target.files.length > 0) await uploadAvatar(e.target.files[0]);
    });

    async function uploadAvatar(file) {
        if (!window.supabase || !window.currentUser) return;
        try {
            var fileExt = file.name.split('.').pop();
            var fileName = 'avatar_' + window.currentUser.id + '_' + Date.now() + '.' + fileExt;
            var filePath = window.currentUser.id + '/' + fileName;
            var { error: uploadError } = await window.supabase.storage.from('avatars').upload(filePath, file, { upsert: true });
            if (uploadError) throw uploadError;
            var { data: { publicUrl } } = window.supabase.storage.from('avatars').getPublicUrl(filePath);
            var { error: updateError } = await window.supabase.from('operatori_profiles').update({ avatar_url: publicUrl }).eq('user_id', window.currentUser.id);
            if (updateError) throw updateError;
            displayAvatar(publicUrl);
            showNotification('Foto profilo aggiornata', 'success');
        } catch (err) {
            showNotification('Errore upload foto: ' + err.message, 'error');
        }
    }

    function displayAvatar(url) {
        if (url) {
            profileAvatarImg.src = url;
            profileAvatarImg.classList.remove('hidden');
            profileAvatarInitials.classList.add('hidden');
        } else {
            profileAvatarImg.classList.add('hidden');
            profileAvatarInitials.classList.remove('hidden');
            var nome = document.getElementById('field-nome').value || '';
            var cognome = document.getElementById('field-cognome').value || '';
            profileAvatarInitials.textContent = (nome.charAt(0) + cognome.charAt(0)).toUpperCase() || '--';
        }
    }

    function gv(id) { var el = document.getElementById(id); return el ? el.value : ''; }
    function sv(id, v) { var el = document.getElementById(id); if (el) el.value = v || ''; }
    function gc(id) { var el = document.getElementById(id); return el ? el.checked : false; }
    function sc(id, v) { var el = document.getElementById(id); if (el) el.checked = !!v; }

    async function loadProfileData() {
        if (!window.supabase || !window.currentUser) return;
        try {
            var { data, error } = await window.supabase.from('operatori_profiles').select('*').eq('user_id', window.currentUser.id).maybeSingle();
            if (error) throw error;
            if (data) {
                sv('field-nome', data.nome); sv('field-cognome', data.cognome);
                sv('field-email', data.email || window.currentUser.email); sv('field-telefono', data.telefono);
                sv('field-data-nascita', data.data_nascita); sv('field-luogo-nascita', data.luogo_nascita);
                sv('field-iscrizione-albo', data.iscrizione_albo);
                sc('field-auto-munito', data.auto_munito); sc('field-trasferte', data.disponibilita_trasferte);
                sv('field-bio', data.bio);
                var df = data.dati_fatturazione || {};
                sv('field-piva', df.piva); sv('field-cf', df.cf); sv('field-sdi', df.sdi);
                sv('field-indirizzo-fatturazione', data.indirizzo_fatturazione); sv('field-pec', data.pec);
                if (data.avatar_url) displayAvatar(data.avatar_url); else displayAvatar(null);
            } else {
                sv('field-email', window.currentUser.email || '');
                displayAvatar(null);
            }
        } catch (err) { console.error('[Profilo] Errore caricamento:', err); }
    }

    async function saveProfileData(e) {
        e.preventDefault();
        if (!window.supabase || !window.currentUser) return;
        btnSalva.disabled = true;
        btnSalva.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">sync</span> Salvataggio...';
        try {
            var df = { piva: gv('field-piva'), cf: gv('field-cf'), sdi: gv('field-sdi') };
            var { error } = await window.supabase.from('operatori_profiles').update({
                nome: gv('field-nome'), cognome: gv('field-cognome'), telefono: gv('field-telefono'),
                data_nascita: gv('field-data-nascita') || null, luogo_nascita: gv('field-luogo-nascita'),
                iscrizione_albo: gv('field-iscrizione-albo'),
                auto_munito: gc('field-auto-munito'), disponibilita_trasferte: gc('field-trasferte'),
                indirizzo_fatturazione: gv('field-indirizzo-fatturazione'),
                pec: gv('field-pec'), dati_fatturazione: df
            }).eq('user_id', window.currentUser.id);
            if (error) throw error;
            if (window.currentUserProfile) {
                window.currentUserProfile.nome = gv('field-nome');
                window.currentUserProfile.cognome = gv('field-cognome');
                window.currentUserProfile.telefono = gv('field-telefono');
            }
            showNotification('Profilo salvato con successo', 'success');
        } catch (err) { showNotification('Errore: ' + err.message, 'error'); }
        finally {
            btnSalva.disabled = false;
            btnSalva.innerHTML = '<span class="material-symbols-outlined text-[18px]">save</span> Salva Profilo';
        }
    }

    async function loadDocuments() {
        if (!window.supabase || !window.currentUser) return;
        try {
            var { data, error } = await window.supabase.from('operatori_documenti').select('*').eq('user_id', window.currentUser.id).order('created_at', { ascending: false });
            if (error) docs = [];
            else docs = data || [];
            renderDocuments();
        } catch (err) {
            docs = [];
            renderDocuments();
        }
    }

    function renderDocuments() {
        var container = document.getElementById('documenti-lista');
        if (!container) return;
        if (docs.length === 0) {
            container.innerHTML = '<div class="text-center py-8 text-on-surface-variant font-label text-sm">Nessun documento caricato</div>';
            return;
        }
        var html = '';
        for (var i = 0; i < docs.length; i++) {
            var d = docs[i];
            var icon = 'description';
            if (d.tipo && d.tipo.indexOf('pdf') !== -1) icon = 'picture_as_pdf';
            else if (d.tipo && (d.tipo.indexOf('image') !== -1 || d.tipo.indexOf('png') !== -1 || d.tipo.indexOf('jpg') !== -1)) icon = 'image';
            else if (d.tipo && (d.tipo.indexOf('excel') !== -1 || d.tipo.indexOf('xls') !== -1)) icon = 'table_chart';
            else if (d.tipo && (d.tipo.indexOf('word') !== -1 || d.tipo.indexOf('doc') !== -1)) icon = 'article';
            html +=
                '<div class="flex items-center justify-between p-3 bg-surface-container-low rounded-lg group">' +
                    '<div class="flex items-center gap-3 min-w-0">' +
                        '<span class="material-symbols-outlined text-primary flex-shrink-0">' + icon + '</span>' +
                        '<div class="min-w-0">' +
                            '<p class="text-sm font-label text-on-surface truncate">' + (d.nome_file || d.titolo || 'Documento') + '</p>' +
                            '<p class="text-xs text-on-surface-variant">' + formatFileSize(d.dimensione) + ' &middot; ' + formatDate(d.created_at) + '</p>' +
                        '</div>' +
                    '</div>' +
                    '<div class="flex items-center gap-2 flex-shrink-0">' +
                        (d.url ? '<a href="' + d.url + '" target="_blank" class="text-primary hover:text-primary-container transition-colors p-1" title="Scarica"><span class="material-symbols-outlined text-[18px]">download</span></a>' : '') +
                        '<button class="text-error hover:text-red-700 transition-colors p-1 doc-del-btn" data-id="' + d.id + '" title="Elimina"><span class="material-symbols-outlined text-[18px]">delete</span></button>' +
                    '</div>' +
                '</div>';
        }
        container.innerHTML = html;
        var btns = container.querySelectorAll('.doc-del-btn');
        for (var j = 0; j < btns.length; j++) {
            btns[j].addEventListener('click', function() { deleteDocument(this.getAttribute('data-id')); });
        }
    }

    async function uploadDocument(file) {
        if (!window.supabase || !window.currentUser) return;
        try {
            var fileExt = file.name.split('.').pop();
            var fileName = 'doc_' + window.currentUser.id + '_' + Date.now() + '.' + fileExt;
            var filePath = window.currentUser.id + '/documenti/' + fileName;
            var { error: uploadError } = await window.supabase.storage.from('operatori_documenti').upload(filePath, file);
            if (uploadError) throw uploadError;
            var { data: { publicUrl } } = window.supabase.storage.from('operatori_documenti').getPublicUrl(filePath);
            var { error: insertError } = await window.supabase.from('operatori_documenti').insert({
                user_id: window.currentUser.id, nome_file: file.name, url: publicUrl, tipo: file.type, dimensione: file.size
            });
            if (insertError) throw insertError;
            showNotification('Documento caricato: ' + file.name, 'success');
            docUploadInput.value = '';
            await loadDocuments();
        } catch (err) { showNotification('Errore upload: ' + err.message, 'error'); }
    }

    async function deleteDocument(id) {
        if (!window.supabase) return;
        if (!confirm('Eliminare questo documento?')) return;
        try {
            var doc = docs.find(function(d) { return d.id === id; });
            if (doc && doc.url) {
                var parts = doc.url.split('/operatori_documenti/');
                if (parts.length > 1) {
                    var storagePath = parts[1].split('?')[0];
                    await window.supabase.storage.from('operatori_documenti').remove([storagePath]);
                }
            }
            var { error } = await window.supabase.from('operatori_documenti').delete().eq('id', id);
            if (error) throw error;
            await loadDocuments();
            showNotification('Documento eliminato', 'success');
        } catch (err) { showNotification('Errore: ' + err.message, 'error'); }
    }

    btnUploadDoc.addEventListener('click', function() {
        if (docUploadInput.files.length > 0) uploadDocument(docUploadInput.files[0]);
        else showNotification('Seleziona un file da caricare', 'info');
    });

    profileForm.addEventListener('submit', saveProfileData);

    function waitForInit() {
        var attempts = 0;
        function check() {
            attempts++;
            if (window.supabase && window.currentUser) {
                loadProfileData(); loadDocuments(); setupAvatarDropdown();
            } else if (attempts < 60) setTimeout(check, 100);
        }
        check();
    }

    function setupAvatarDropdown() {
        var ab = document.getElementById('avatar-btn');
        var ad = document.getElementById('avatar-dropdown');
        var dl = document.getElementById('dropdown-logout');
        if (ab) ab.addEventListener('click', function(e) { e.stopPropagation(); ad.classList.toggle('hidden'); });
        document.addEventListener('click', function() { if (ad) ad.classList.add('hidden'); });
        if (dl) dl.addEventListener('click', async function(e) {
            e.preventDefault();
            if (window.supabase) await window.supabase.auth.signOut();
            localStorage.clear();
            window.location.href = 'templates/login.html';
        });
    }

    function formatDate(d) {
        if (!d) return '';
        var dt = new Date(d);
        if (isNaN(dt.getTime())) return '';
        return dt.toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function formatFileSize(bytes) {
        if (!bytes) return '';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function showNotification(msg, type) {
        var old = document.querySelector('.hdl-notification');
        if (old) old.remove();
        var colors = { error: '#b91c1c', success: '#166534', info: '#1e40af' };
        var icons = { error: 'error', success: 'check_circle', info: 'info' };
        var el = document.createElement('div');
        el.className = 'hdl-notification';
        el.style.cssText = 'position:fixed;top:16px;right:16px;z-index:9999;display:flex;align-items:center;gap:12px;padding:14px 20px;color:#fff;font-size:14px;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.18);background:' + (colors[type] || colors.info);
        el.innerHTML = '<span class="material-symbols-outlined" style="font-size:20px">' + (icons[type] || 'info') + '</span><p style="flex:1">' + msg + '</p><button onclick="this.parentElement.remove()" style="margin-left:8px;opacity:.7"><span class="material-symbols-outlined" style="font-size:16px">close</span></button>';
        document.body.appendChild(el);
        setTimeout(function() { if (el.parentElement) el.remove(); }, 5000);
    }

    waitForInit();
});
    // Mobile sidebar toggle
    var menuToggle = document.getElementById('mobile-menu-toggle');
    var sidebar = document.getElementById('sidebar-menu');
    var overlay = document.getElementById('mobile-sidebar-overlay');
    function openSidebar() {
        sidebar.classList.remove('-translate-x-full');
        sidebar.classList.add('translate-x-0');
        overlay.classList.remove('hidden');
        if (menuToggle) menuToggle.querySelector('.material-symbols-outlined').textContent = 'close';
    }
    function closeSidebar() {
        sidebar.classList.add('-translate-x-full');
        sidebar.classList.remove('translate-x-0');
        overlay.classList.add('hidden');
        if (menuToggle) menuToggle.querySelector('.material-symbols-outlined').textContent = 'menu';
    }
    if (menuToggle) {
        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            var isOpen = !sidebar.classList.contains('-translate-x-full');
            if (isOpen) closeSidebar();
            else openSidebar();
        });
    }
    if (overlay) overlay.addEventListener('click', closeSidebar);
    function checkScreenSize() {
        if (window.innerWidth >= 1024) {
            sidebar.classList.remove('-translate-x-full');
            sidebar.classList.remove('translate-x-0');
            overlay.classList.add('hidden');
            if (menuToggle) menuToggle.querySelector('.material-symbols-outlined').textContent = 'menu';
        } else {
            closeSidebar();
        }
    }
    window.addEventListener('resize', checkScreenSize);
</script>
</body></html>
